<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>V2 06/10 — jeudi 03/12/2026 · Numériser sans ajouter de complexité</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', 'Segoe UI', 'Arial', sans-serif; background: #d0d0d0; }

  /* ═══════════════════════════════════════════════════════════════
     GABARIT V2 « Performance » — visuel unique, 1200 x 1500 (4:5)
     Bandeau #163D78, accent #FBAA16 (gabarit-v2-performance.html).
     Adaptations ZONE SÛRE (améliorations A-2026-11-18-01 et A-2026-11-18-02) :
     titre centré, marges latérales >= 12 % (144 px), titre ET logo dans le
     carré central (au moins 170 px libres en bas) — le logo quitte le coin
     bas-droit (coupé par le recadrage carré Facebook) pour une pastille
     blanche centrée sous le titre.
     ═══════════════════════════════════════════════════════════════ */

  .slide {
    width: 1200px; height: 1500px;
    position: relative; overflow: hidden;
    margin: 24px auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    background: #163D78;
  }

  .v2-photo { position: absolute; inset: 0; z-index: 0; }
  .v2-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }

  .v2-scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 900px; z-index: 1;
    background: linear-gradient(to top, rgba(22,61,120,0.22) 0%, rgba(22,61,120,0.06) 50%, rgba(22,61,120,0) 100%);
  }

  /* Bandeau bas, bord supérieur courbe montant vers la droite */
  .v2-band { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; z-index: 2; }
  .v2-band svg { position: absolute; top: -118px; left: 0; width: 100%; height: 120px; display: block; }
  .v2-band .band-body { position: absolute; inset: 0; background: #163D78; }

  /* Titre centré dans la zone sûre */
  .v2-text { position: absolute; z-index: 3; left: 144px; right: 144px; bottom: 420px; text-align: center; }
  .v2-title { color: #FFFFFF; text-transform: uppercase; letter-spacing: -0.5px; }
  .v2-title .l1 { display: block; font-size: 62px; font-weight: 900; line-height: 1.10; }
  .v2-title .l2 { display: block; font-size: 56px; font-weight: 400; line-height: 1.16; margin-top: 6px; }
  .v2-rule { width: 190px; height: 9px; background: #FBAA16; border-radius: 5px; margin: 30px auto 0; }

  /* Logo : pastille blanche centrée, filet d'accent, 180 px au-dessus du bas */
  .v2-logo {
    position: absolute; z-index: 4; left: 50%; bottom: 180px; transform: translateX(-50%);
    background: #FFFFFF; border-radius: 90px; padding: 4px 44px;
    border: 7px solid #FBAA16;
  }
  .v2-logo img { height: 190px; object-fit: contain; display: block; }
</style>
</head>
<body>

<!-- ═══ V2 06/10 — W49 · jeudi 03/12/2026 · « Numériser sans ajouter de complexité » ═══ -->
<div class="slide">
  <div class="v2-photo">
    <img src="../../production/images/banque/w41-slide3-ligne-datee-01.jpg" alt="">
  </div>
  <div class="v2-scrim"></div>

  <div class="v2-band">
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
      <path d="M0,120 L0,58 C300,10 640,-10 900,6 C1040,15 1130,30 1200,44 L1200,120 Z" fill="#163D78"></path>
    </svg>
    <div class="band-body"></div>
  </div>

  <div class="v2-text">
    <h1 class="v2-title">
      <span class="l1">Num&eacute;riser,</span>
      <span class="l2">c&rsquo;est aussi arr&ecirc;ter<br>l&rsquo;ancien circuit</span>
    </h1>
    <div class="v2-rule"></div>
  </div>

  <div class="v2-logo"><img src="https://www.perfeco.nc/logo-perfeco.svg" alt="PerfEco"></div>
</div>

</body>
</html>
