name: "PerfEco — Publication mardi (carrousel : Company + Facebook + profil perso, tout publié directement)"

on:
  schedule:
    - cron: '0 0 * * 2'  # Mardi 00h00 UTC = 11h00 Nouvelle-Calédonie (cas normal)
    - cron: '0 0 * * 1'  # Lundi 00h00 UTC = 11h00 NC — décalages exceptionnels (voir ci-dessous)
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE LUNDI (ajouté le 21/08/2026)
#
# Décision de Jean-Michel pour la semaine du 24/09/2026 : le jeudi 24/09 étant férié
# en Nouvelle-Calédonie (Fête de la Citoyenneté), cette semaine-là publie
# exceptionnellement le LUNDI (post long) et le MERCREDI (post court).
#
# Sans cron le lundi, le post long du lundi 21/09 ne serait jamais parti : le workflow
# ne se déclenche que le mardi, et le mardi 22/09 il aurait trouvé une date_prevue au
# 21/09 — donc abandonné. Échec silencieux garanti.
#
# CE CRON SUPPLÉMENTAIRE NE FAIT PAS ÉCHOUER LE WORKFLOW LES AUTRES SEMAINES, mais
# cela a demandé un correctif : la garde de fraîcheur sortait en `exit 1` dès que la
# date ne correspondait pas, donc le workflow aurait échoué tous les lundis. Elle
# distingue désormais deux cas — un écart le mardi (jour habituel) reste une anomalie
# bruyante, un écart le jour de rattrapage est une sortie normale (`publier=false`,
# étapes suivantes sautées). Sans cette distinction, une alerte hebdomadaire sans objet
# aurait fini par noyer les vraies.
#
# L'étape de contrôle ci-dessous exige
# que `date_prevue` soit exactement la date du jour en NC. Tous les autres lundis de
# l'année, la file porte une date de mardi et le run s'arrête proprement sans rien
# publier. Le coût est un run à vide par semaine ; le bénéfice est que le pipeline
# absorbe désormais n'importe quel décalage pour férié, sans intervention.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        id: fraicheur
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            # Deux situations très différentes, à ne pas confondre (corrigé le 21/08/2026) :
            if [ "$DOW" = "2" ]; then
              # Mardi, le jour habituel : la file DEVRAIT porter la date du jour.
              # Un écart ici est une vraie anomalie — c'est le filet qui a rattrapé
              # plusieurs bascules ratées. On échoue bruyamment.
              echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon."
              exit 1
            fi
            # Lundi : jour ajouté pour absorber les décalages de férié. Rien à publier
            # ici la plupart des semaines — c'est le cas NORMAL, surtout pas une erreur.
            # Sans cette distinction, le workflow échouerait chaque semaine et noierait
            # les vraies alertes.
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Rien à publier aujourd'hui : la file vise le $DATE_PREVUE, nous sommes le $TODAY_NC. Sortie normale."
            exit 0
          fi
          echo "publier=true" >> "$GITHUB_OUTPUT"
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      - name: LinkedIn Company Page + Facebook (webhook unique, profil perso suspendu via filtre Make)
        id: social
        if: steps.fraicheur.outputs.publier == 'true'
        continue-on-error: true
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe NOCAROUSEL pour bloquer la route profil perso) = ${SEMAINE}-NOCAROUSEL"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/bp97dhwfnsx2yxmxr8sguhlvrdjl6kx6" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-NOCAROUSEL")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          [ "$HTTP_CODE" = "200" ]

      - name: LinkedIn profil perso (carrousel PUBLIÉ directement — appel API direct)
        id: li_profil
        if: steps.fraicheur.outputs.publier == 'true'
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          API_VERSION=$(jq -r '.linkedin_api_version' "$FILE")
          MESSAGE=$(jq -r '.linkedin_profil.message' "$FILE")

          echo "DEBUG: API_VERSION=$API_VERSION"
          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"

          URNS=()
          i=0
          while read -r URL; do
            i=$((i+1))
            echo "--- Slide $i : $URL ---"

            DL_CODE=$(curl -s -o "slide$i.png" -w "%{http_code}" "$URL")
            echo "DEBUG: téléchargement image -> HTTP $DL_CODE"
            if [ "$DL_CODE" != "200" ]; then
              echo "::error::Échec téléchargement slide $i ($URL) — HTTP $DL_CODE"
              exit 1
            fi

            jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/init_body.json
            INIT_CODE=$(curl -s -o /tmp/init.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
              -H "Authorization: Bearer $LINKEDIN_TOKEN" \
              -H "LinkedIn-Version: $API_VERSION" \
              -H "X-Restli-Protocol-Version: 2.0.0" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/init_body.json)
            echo "DEBUG: initializeUpload -> HTTP $INIT_CODE"
            cat /tmp/init.json

            UPLOAD_URL=$(jq -r '.value.uploadUrl // empty' /tmp/init.json)
            URN=$(jq -r '.value.image // empty' /tmp/init.json)

            if [ -z "$UPLOAD_URL" ]; then
              echo "::error::Échec initialisation upload slide $i — HTTP $INIT_CODE, réponse ci-dessus"
              if grep -q "NONEXISTENT_VERSION" /tmp/init.json; then
                echo "::error::426 NONEXISTENT_VERSION — mettre à jour linkedin_api_version dans automation-queue/mardi.json"
              fi
              exit 1
            fi

            PUT_CODE=$(curl -s -o /tmp/put.txt -w "%{http_code}" -X PUT "$UPLOAD_URL" -H "Authorization: Bearer $LINKEDIN_TOKEN" -H "Content-Type: image/png" --data-binary "@slide$i.png")
            echo "DEBUG: upload PUT -> HTTP $PUT_CODE"
            if [ "$PUT_CODE" != "201" ] && [ "$PUT_CODE" != "200" ]; then
              echo "::error::Échec upload PUT slide $i — HTTP $PUT_CODE"
              cat /tmp/put.txt
              exit 1
            fi

            URNS+=("$URN")
            echo "✅ Slide $i → $URN"
          done < <(jq -r '.linkedin_profil.image_urls[]' "$FILE")

          IMAGES_JSON="[]"
          idx=0
          for URN in "${URNS[@]}"; do
            idx=$((idx+1))
            IMAGES_JSON=$(echo "$IMAGES_JSON" | jq --arg alt "Slide $idx" --arg id "$URN" '. + [{altText:$alt, id:$id}]')
          done

          jq -n --arg author "$MEMBER_URN" --arg msg "$MESSAGE" --argjson images "$IMAGES_JSON" \
            '{author:$author, commentary:$msg, visibility:"PUBLIC", distribution:{feedDistribution:"MAIN_FEED", targetEntities:[], thirdPartyDistributionChannels:[]}, content:{multiImage:{images:$images}}, lifecycleState:"PUBLISHED"}' > /tmp/post_body.json

          echo "DEBUG: taille POST_BODY :"; wc -c < /tmp/post_body.json

          HTTP_CODE=$(curl -s -o /tmp/lip.txt -w "%{http_code}" -X POST "https://api.linkedin.com/rest/posts" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/post_body.json)

          echo "HTTP $HTTP_CODE"; cat /tmp/lip.txt
          [ "$HTTP_CODE" = "201" ]

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always()
        run: |
          echo "LinkedIn Company Page + Facebook (webhook unique) : ${{ steps.social.outcome }}"
          echo "LinkedIn profil perso (carrousel publié directement) : ${{ steps.li_profil.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ] || [ "${{ steps.li_profil.outcome }}" = "failure" ]; then
            echo "::error::Au moins un canal a échoué — voir les logs des étapes ci-dessus."
            exit 1
          fi
          echo "✅ Company Page + Facebook envoyés via le webhook unique. Profil perso : carrousel PUBLIÉ directement (plus de brouillon à finaliser)."
          echo "⚠️ Un HTTP 201 confirme la création du post côté LinkedIn, pas la diffusion Company Page/Facebook (qui dépend du scénario Make.com) — vérification réelle par check-apres-publication.yml."
