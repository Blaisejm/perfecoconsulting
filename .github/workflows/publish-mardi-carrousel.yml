name: "PerfEco — Publication mardi (carrousel : Company + Facebook + profil perso, tout publié directement)"

on:
  # PLUSIEURS DÉCLENCHEMENTS depuis le 22/11/2026 (feu vert de Jean-Michel ; heure cible
  # 11h00 NC) : le cron GitHub part avec 5 h de retard ou plus. Le premier arrivé
  # ATTEND 11h00 NC, pose le tag pub-mardi-<date> et publie ; les suivants voient le tag
  # et s'arrêtent (scripts/creneau-publication.sh). Après 17h00 NC, rien ne part : alerte.
  # Les créneaux du DIMANCHE/LUNDI en UTC sont le LUNDI/MARDI matin en NC.
  schedule:
    # Mardi NC (cas normal)
    - cron: '47 20 * * 1'  # Mardi 07h47 NC — attend 11h00
    - cron: '47 21 * * 1'  # Mardi 08h47 NC — secours
    - cron: '47 22 * * 1'  # Mardi 09h47 NC — secours
    - cron: '47 23 * * 1'  # Mardi 10h47 NC — secours
    - cron: '17 1 * * 2'   # Mardi 12h17 NC — rattrapage
    - cron: '17 3 * * 2'   # Mardi 14h17 NC — rattrapage (limite 17h00)
    # Lundi NC — décalages exceptionnels (voir ci-dessous) ; à vide les autres semaines
    - cron: '47 20 * * 0'  # Lundi 07h47 NC
    - cron: '47 22 * * 0'  # Lundi 09h47 NC
    - cron: '17 1 * * 1'   # Lundi 12h17 NC — rattrapage
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE LUNDI (ajouté le 21/08/2026)
#
# Décision de Jean-Michel pour la semaine du 24/09/2026 : le jeudi 24/09 étant férié
# en Nouvelle-Calédonie (Fête de la Citoyenneté), cette semaine-là publie
# exceptionnellement le LUNDI (post long) et le MERCREDI (post court).
#
# Sans cron le lundi, le post long du lundi 21/09 ne serait jamais parti : le workflow
# ne se déclenche que le mardi, et le mardi 22/09 il aurait trouvé une date_prevue au
# 21/09 — donc abandonné. Échec silencieux garanti.
#
# CE CRON SUPPLÉMENTAIRE NE FAIT PAS ÉCHOUER LE WORKFLOW LES AUTRES SEMAINES, mais
# cela a demandé un correctif : la garde de fraîcheur sortait en `exit 1` dès que la
# date ne correspondait pas, donc le workflow aurait échoué tous les lundis. Elle
# distingue désormais deux cas — un écart le mardi (jour habituel) reste une anomalie
# bruyante, un écart le jour de rattrapage est une sortie normale (`publier=false`,
# étapes suivantes sautées). Sans cette distinction, une alerte hebdomadaire sans objet
# aurait fini par noyer les vraies.
#
# L'étape de contrôle ci-dessous exige
# que `date_prevue` soit exactement la date du jour en NC. Tous les autres lundis de
# l'année, la file porte une date de mardi et le run s'arrête proprement sans rien
# publier. Le coût est un run à vide par semaine ; le bénéfice est que le pipeline
# absorbe désormais n'importe quel décalage pour férié, sans intervention.

# Ajouté le 18/11/2026 (diffusion 100 % cloud, étape 1) — Jamais deux exécutions simultanées d'une même publication (pas de doublon si un run manuel croise le cron).
# cancel-in-progress: false = le run suivant ATTEND, il n'annule jamais celui en cours.
# issues: write depuis le 19/11/2026 : un échec ouvre une issue « alerte » (e-mail GitHub, PC éteint).
# contents: write depuis le 22/11/2026 : uniquement pour poser le tag pub-mardi-<date> (anti-doublon).
permissions:
  contents: write
  issues: write

concurrency:
  group: publication-mardi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        id: fraicheur
        run: |
          set -e
          # Pause décidée par Jean-Michel (registre « suspendu ») : sortie normale, sans alerte.
          if bash scripts/creneau-suspendu.sh mardi; then echo "publier=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          FILE="automation-queue/mardi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            # Deux situations très différentes, à ne pas confondre (corrigé le 21/08/2026) :
            if [ "$DOW" = "2" ]; then
              # Mardi, le jour habituel : la file DEVRAIT porter la date du jour.
              # Un écart ici est une vraie anomalie — c'est le filet qui a rattrapé
              # plusieurs bascules ratées. On échoue bruyamment.
              echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon."
              exit 1
            fi
            # Lundi : jour ajouté pour absorber les décalages de férié. Rien à publier
            # ici la plupart des semaines — c'est le cas NORMAL, surtout pas une erreur.
            # Sans cette distinction, le workflow échouerait chaque semaine et noierait
            # les vraies alertes.
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Rien à publier aujourd'hui : la file vise le $DATE_PREVUE, nous sommes le $TODAY_NC. Sortie normale."
            exit 0
          fi
          echo "publier=true" >> "$GITHUB_OUTPUT"
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      - name: Créneau — déjà publié ? sinon attendre 11h00 NC (limite 17h00)
        id: creneau
        if: steps.fraicheur.outputs.publier == 'true'
        run: bash scripts/creneau-publication.sh attendre mardi 1100 1700

      - name: Créneau — poser le tag du jour (un seul run publie)
        id: tag
        if: steps.creneau.outputs.suite == 'publier'
        run: bash scripts/creneau-publication.sh prendre mardi

      - name: LinkedIn Company Page + Facebook (webhook unique, profil perso suspendu via filtre Make)
        id: social
        if: steps.tag.outputs.suite == 'publier'
        continue-on-error: true
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          if [ -z "$MAKE_WEBHOOK" ]; then
            echo "::error::Le secret MAKE_WEBHOOK est vide ou absent — publication annulee (rien envoye)."
            exit 1
          fi

          set -e
          FILE="automation-queue/mardi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe NOCAROUSEL pour bloquer la route profil perso) = ${SEMAINE}-NOCAROUSEL"

          # Garde du 19/11/2026 (étape 2) : message non vide, image en 200, scénario actif — sinon rien n'est envoyé.
          bash scripts/garde-make.sh "$FILE"

          # Image carrée Facebook (22/11/2026, A-2026-11-22-09) : si la file en porte une, Facebook part
          # EN DIRECT (étape suivante) et Make ne sert plus Facebook ce jour-là (suffixe -NOFB).
          SUFFIXE_FB=""
          if [ -n "$(jq -r '.social_post.facebook_image_url // empty' "$FILE")" ]; then
            SUFFIXE_FB="-NOFB"; echo "fb_direct=oui" >> "$GITHUB_OUTPUT"
            echo "Image carrée présente : Facebook en direct, Make sans Facebook (suffixe -NOFB)."
          fi

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$MAKE_WEBHOOK" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-NOCAROUSEL${SUFFIXE_FB}")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          [ "$HTTP_CODE" = "200" ]

      # ── CHANGEMENT DU 18/11/2026, décision de Jean-Michel (« Oui, passe le carrousel perso en PDF ») ──
      # Le profil perso reçoit désormais le carrousel en DOCUMENT PDF (vrai carrousel à
      # faire défiler) : en multi-images, LinkedIn affichait une mosaïque et recadrait la
      # couverture (titre collé au bord gauche sur I1 le 03/11). Le PDF est assemblé à
      # partir des mêmes PNG (linkedin_profil.image_urls), par scripts/linkedin-carrousel-pdf.sh.
      #
      # REPLI : si le PDF échoue AVANT toute création de post (code 2 du script : upload,
      # traitement, version d'API...), l'ancienne étape multi-images ci-dessous part à sa
      # place — le mardi ne reste jamais sans post perso. Si la création du post elle-même
      # a été tentée (code 1), PAS de repli : l'état est incertain et un repli risquerait
      # un doublon ; l'étape échoue et l'alerte part.
      - name: Facebook EN DIRECT avec l'image carrée (seulement si la file en porte une)
        id: fb_direct
        if: "!cancelled() && steps.tag.outputs.suite == 'publier' && steps.social.outputs.fb_direct == 'oui'"
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
        run: bash scripts/facebook-direct-ou-repli.sh automation-queue/mardi.json

      - name: LinkedIn profil perso — carrousel en DOCUMENT PDF (API directe)
        id: li_pdf
        if: steps.tag.outputs.suite == 'publier'
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          RC=0
          bash scripts/linkedin-carrousel-pdf.sh automation-queue/mardi.json PUBLISHED || RC=$?
          if [ "$RC" = "2" ]; then
            echo "repli=oui" >> "$GITHUB_OUTPUT"
            echo "::warning title=Carrousel PDF::échec avant création du post — repli sur le carrousel multi-images (étape suivante)."
            exit 0
          fi
          exit "$RC"

      - name: LinkedIn profil perso — REPLI multi-images (seulement si le PDF a échoué avant création)
        id: li_profil
        if: steps.tag.outputs.suite == 'publier' && steps.li_pdf.outputs.repli == 'oui'
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          # Version d'API LinkedIn : SOURCE UNIQUE dans automation-agent/calendrier.json
          # depuis le 21/09/2026. La valeur qui subsiste dans la file d'attente n'est
          # plus qu'un repli — elle a expiré trois fois sans que personne ne le voie,
          # parce qu'elle était recopiée dans cinq endroits à la fois.
          CALENDRIER="automation-agent/calendrier.json"
          # `|| true` indispensable : GitHub lance les `run:` avec `bash -e`, et une
          # affectation dont la substitution échoue tuerait l'étape AVANT d'atteindre
          # le repli — le filet de sécurité ne servirait alors jamais.
          API_VERSION=$(jq -r '.linkedin.api_version // empty' "$CALENDRIER" 2>/dev/null || true)
          SOURCE_VERSION="$CALENDRIER"
          if [ -z "$API_VERSION" ]; then
            API_VERSION=$(jq -r '.linkedin_api_version // empty' "$FILE" 2>/dev/null || true)
            SOURCE_VERSION="$FILE (REPLI)"
            echo "::warning::.linkedin.api_version absent de $CALENDRIER — repli sur $FILE. Rétablir la source unique."
          fi
          if [ -z "$API_VERSION" ]; then
            echo "::error::Aucune version d'API LinkedIn trouvée, ni dans $CALENDRIER ni dans $FILE. Le carrousel du profil perso ne peut pas partir."
            exit 1
          fi
          MESSAGE=$(jq -r '.linkedin_profil.message' "$FILE")

          echo "DEBUG: API_VERSION=$API_VERSION (source : $SOURCE_VERSION)"
          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"

          URNS=()
          i=0
          while read -r URL; do
            i=$((i+1))
            echo "--- Slide $i : $URL ---"

            DL_CODE=$(curl -s -o "slide$i.png" -w "%{http_code}" "$URL")
            echo "DEBUG: téléchargement image -> HTTP $DL_CODE"
            if [ "$DL_CODE" != "200" ]; then
              echo "::error::Échec téléchargement slide $i ($URL) — HTTP $DL_CODE"
              exit 1
            fi

            jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/init_body.json
            INIT_CODE=$(curl -s -o /tmp/init.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
              -H "Authorization: Bearer $LINKEDIN_TOKEN" \
              -H "LinkedIn-Version: $API_VERSION" \
              -H "X-Restli-Protocol-Version: 2.0.0" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/init_body.json)
            echo "DEBUG: initializeUpload -> HTTP $INIT_CODE"
            cat /tmp/init.json

            UPLOAD_URL=$(jq -r '.value.uploadUrl // empty' /tmp/init.json)
            URN=$(jq -r '.value.image // empty' /tmp/init.json)

            if [ -z "$UPLOAD_URL" ]; then
              echo "::error::Échec initialisation upload slide $i — HTTP $INIT_CODE, réponse ci-dessus"
              if grep -q "NONEXISTENT_VERSION" /tmp/init.json; then
                echo "::error::426 NONEXISTENT_VERSION — mettre à jour .linkedin.api_version dans automation-agent/calendrier.json (SOURCE UNIQUE depuis le 21/09/2026), pas dans automation-queue/mardi.json qui n'est qu'un repli."
              fi
              exit 1
            fi

            PUT_CODE=$(curl -s -o /tmp/put.txt -w "%{http_code}" -X PUT "$UPLOAD_URL" -H "Authorization: Bearer $LINKEDIN_TOKEN" -H "Content-Type: image/png" --data-binary "@slide$i.png")
            echo "DEBUG: upload PUT -> HTTP $PUT_CODE"
            if [ "$PUT_CODE" != "201" ] && [ "$PUT_CODE" != "200" ]; then
              echo "::error::Échec upload PUT slide $i — HTTP $PUT_CODE"
              cat /tmp/put.txt
              exit 1
            fi

            URNS+=("$URN")
            echo "✅ Slide $i → $URN"
          done < <(jq -r '.linkedin_profil.image_urls[]' "$FILE")

          IMAGES_JSON="[]"
          idx=0
          for URN in "${URNS[@]}"; do
            idx=$((idx+1))
            IMAGES_JSON=$(echo "$IMAGES_JSON" | jq --arg alt "Slide $idx" --arg id "$URN" '. + [{altText:$alt, id:$id}]')
          done

          jq -n --arg author "$MEMBER_URN" --arg msg "$MESSAGE" --argjson images "$IMAGES_JSON" \
            '{author:$author, commentary:$msg, visibility:"PUBLIC", distribution:{feedDistribution:"MAIN_FEED", targetEntities:[], thirdPartyDistributionChannels:[]}, content:{multiImage:{images:$images}}, lifecycleState:"PUBLISHED"}' > /tmp/post_body.json

          echo "DEBUG: taille POST_BODY :"; wc -c < /tmp/post_body.json

          HTTP_CODE=$(curl -s -o /tmp/lip.txt -w "%{http_code}" -X POST "https://api.linkedin.com/rest/posts" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/post_body.json)

          echo "HTTP $HTTP_CODE"; cat /tmp/lip.txt
          [ "$HTTP_CODE" = "201" ]

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always() && steps.tag.outputs.suite == 'publier'
        run: |
          if [ "${{ steps.fb_direct.outcome }}" = "failure" ]; then
            echo "::error::Facebook direct (image carrée) en échec, repli compris — vérifier la Page avant tout nouvel envoi."
            exit 1
          fi
          [ "${{ steps.fb_direct.outcome }}" = "success" ] && echo "✅ Facebook publié en direct avec l'image carrée."
          echo "LinkedIn Company Page + Facebook (webhook unique) : ${{ steps.social.outcome }}"
          echo "LinkedIn profil perso — document PDF : ${{ steps.li_pdf.outcome }} (repli demandé : ${{ steps.li_pdf.outputs.repli || 'non' }})"
          echo "LinkedIn profil perso — repli multi-images : ${{ steps.li_profil.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ] || [ "${{ steps.li_pdf.outcome }}" = "failure" ] || [ "${{ steps.li_profil.outcome }}" = "failure" ]; then
            echo "::error::Au moins un canal a échoué — voir les logs des étapes ci-dessus."
            exit 1
          fi
          echo "✅ Company Page + Facebook envoyés via le webhook unique. Profil perso : carrousel PUBLIÉ directement (plus de brouillon à finaliser)."
          echo "⚠️ Un HTTP 201 confirme la création du post côté LinkedIn, pas la diffusion Company Page/Facebook (qui dépend du scénario Make.com) — vérification réelle par check-apres-publication.yml."

      - name: Issue « alerte » si la publication a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUJ=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          bash scripts/issue-alerte.sh "Publication mardi (carrousel) en échec — $AUJ" "La publication **mardi (carrousel)** du $AUJ a échoué (workflow \`${{ github.workflow }}\`).

          Vérifier sur les canaux ce qui est réellement parti AVANT tout nouvel envoi (pas de doublon). Le détail est dans les annotations du run ci-dessous."
