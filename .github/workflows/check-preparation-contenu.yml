name: "PerfEco — Vérification préparation contenu (filet indépendant de Cowork)"

# ---------------------------------------------------------------------------
# POURQUOI CE WORKFLOW EXISTE (18/08/2026)
#
# Cause racine établie ce jour, preuves à l'appui : les routines Cowork qui
# préparent le contenu (mardi-carrousel-creation, jeudi-postcourt-creation,
# vendredi-veilleeco-creation) meurent parfois SILENCIEUSEMENT.
#
# Transcripts retrouvés :
#   perfeco-fix-veille-eco-j7   14/08 → "401 OAuth access token has expired"
#   perfeco-verif-github-actions 15/08 → idem
# La session fait 4 messages : prompt, premier appel d'outil, échec 401, fin.
#
# La tâche se déclenche (lastRunAt confirmé) mais ne produit rien, et surtout
# NE PEUT PAS PRÉVENIR : envoyer un brouillon Gmail est aussi un appel d'outil.
# Sept occurrences depuis le 12/07/2026 étaient restées sans explication, et
# l'hypothèse "Maintenir actif de Cowork" n'a jamais été la bonne.
#
# GitHub Actions ne dépend pas du token Claude : c'est le seul observateur
# capable de constater qu'une routine Cowork n'a rien produit. En cas d'échec,
# GitHub envoie sa notification native — indépendante de Cowork et de Gmail.
#
# ⚠️ Ne jamais déplacer cette vérification dans une routine Cowork : elle
# perdrait exactement la propriété qui la rend utile.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 8 * * *'   # Tous les jours 08h00 UTC = 19h00 NC (après la routine Cowork de 17h)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Le corps bash d'origine ne vérifiait que la présence de `date_prevue`.
      # Les pannes des 19 et 21/08/2026 lui échappaient toutes : schéma périmé
      # (message vide), bascule exécutée sans écrire, image injoignable, dérive
      # de date. Le contrôle est désormais dans un script versionné et testable.
      #
      # Il vérifie aussi le journal d'exécution : quel traitement est intervenu
      # en dernier pour chaque routine, quand, avec quel résultat — demande de
      # Jean-Michel du 21/08/2026. Voir automation-agent/JOURNAL.md.
      - name: Contrôle du pipeline (files, schéma, images, staging, journal)
        run: node scripts/controle-pipeline.mjs
