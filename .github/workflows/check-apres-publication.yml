name: PerfEco — Vérification après-midi (publication réellement visible)

on:
  schedule:
    - cron: '0 3 * * 1,2,3,4,5'  # Lun→Ven 03h00 UTC = 14h00 NC (~3h après les publications de 11h00)
    - cron: '30 7 * * 6'         # Samedi 07h30 UTC = 18h30 NC (~3h après la republication Facebook de 15h30)
  workflow_dispatch:

# Écriture nécessaire depuis le 13/09/2026 : ce workflow clôt désormais l'échéance
# dans automation-agent/publications.json quand la publication est confirmée.
permissions:
  contents: write

# ⚠️ CORRECTION DU 13/09/2026 — les gardes de fraîcheur ne raisonnent plus en HEURES
#
# Les deux contrôles de fraîcheur (post Facebook « de moins de 6h », exécution Make
# « de moins de 5h ») étaient ancrés sur l'heure COURANTE, en supposant une publication
# à 11h00 NC et un contrôle à 14h00. Aucune des deux heures n'est garantie : le cron
# GitHub prend régulièrement du retard.
#
# Le 11/09/2026, la veille éco est partie à 13h13 NC (2h13 de retard) et ce contrôle
# est passé à 18h53 NC : 5h40 d'écart, seuil franchi, ÉCHEC — alors que le log du
# contrôle lui-même affichait « statut=1 opérations=5 » pour 5 attendues, c'est-à-dire
# une publication complète sur les 3 canaux. 3e faux positif de ce type.
#
# Les deux gardes comparent désormais le JOUR NC de l'événement au jour NC courant.
# Un retard de cron, quelle qu'en soit l'ampleur, ne déclenche donc plus rien tant que
# la publication a bien eu lieu dans la journée ; une publication réellement absente
# reste détectée, puisqu'il n'existe alors aucune exécution du jour.
#
# Angle mort assumé : une exécution Make ANTÉRIEURE le même jour (post ad-hoc) pourrait
# masquer l'échec de celle de 11h00. Le contrôle du nombre d'opérations qui suit ferme
# cette porte — un ad-hoc Facebook seul compte 3 opérations, une veille en attend 5 —
# et la règle d'espacement interdit déjà deux publications le même jour sur la Company
# Page. Le risque résiduel est donc très inférieur au bruit qu'on supprime.

# ⚠️ REFONTE DU 21/08/2026 — ce contrôle ne raisonne plus par JOUR DE LA SEMAINE
#
# Il ne tournait que les mardi/jeudi/vendredi et filtrait ses étapes sur le jour. Or la
# semaine du 24/09/2026 publie exceptionnellement le lundi et le mercredi (jeudi 24/09
# férié en NC, décision de Jean-Michel du 21/08) : la semaine la plus risquée de l'année
# aurait été la SEULE sans aucune vérification après publication.
#
# Il raisonne désormais sur ce qui a RÉELLEMENT été publié : une file d'attente dont
# `date_prevue` vaut la date du jour en NC. C'est la même question que se posent les
# workflows de publication eux-mêmes, donc les deux ne peuvent plus diverger.
# Les jours sans publication, toutes les étapes sont sautées et le run se termine à vide.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer ce qui a été publié aujourd'hui
        id: day
        run: |
          DOW=$(TZ="Pacific/Noumea" date +%u)
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          echo "dow=$DOW" >> "$GITHUB_OUTPUT"
          echo "today_nc=$TODAY_NC" >> "$GITHUB_OUTPUT"

          # Une file d'attente portant la date du jour = un contenu publié à 11h00 NC.
          # C'est le critère exact des workflows de publication, donc les deux ne peuvent
          # pas diverger — contrairement à un filtre par jour de la semaine.
          date_de() { [ -f "$1" ] && jq -r '.date_prevue // ""' "$1" || echo ""; }

          CARROUSEL=false; POSTCOURT=false; VEILLE=false
          [ "$(date_de automation-queue/mardi.json)"    = "$TODAY_NC" ] && CARROUSEL=true
          [ "$(date_de automation-queue/jeudi.json)"    = "$TODAY_NC" ] && POSTCOURT=true
          [ "$(date_de automation-queue/vendredi.json)" = "$TODAY_NC" ] && VEILLE=true

          # Le samedi est une republication : elle ne s'appuie sur aucune file datée du jour.
          REPUBLICATION=false
          [ "$DOW" = "6" ] && REPUBLICATION=true

          FORMAT=aucun
          $CARROUSEL     && FORMAT=carrousel
          $POSTCOURT     && FORMAT=postcourt
          $VEILLE        && FORMAT=veille
          $REPUBLICATION && FORMAT=republication

          PUBLICATION=false
          [ "$FORMAT" != "aucun" ] && PUBLICATION=true

          {
            echo "carrousel=$CARROUSEL"
            echo "publication=$PUBLICATION"
            echo "format=$FORMAT"
          } >> "$GITHUB_OUTPUT"

          echo "Date NC : $TODAY_NC (jour $DOW) — publication détectée : $FORMAT"
          if [ "$FORMAT" = "aucun" ]; then
            echo "Aucune file ne porte la date du jour : rien n'a été publié, contrôle sans objet."
          fi

      - name: Vérifier le post Facebook du jour
        id: fb_check
        if: steps.day.outputs.publication == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/fb_posts.json -w "%{http_code}" "https://graph.facebook.com/v19.0/552866114572775/posts?fields=created_time,message&limit=5&access_token=$FB_PAGE_TOKEN")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger l'API Facebook — HTTP $HTTP_CODE"
            cat /tmp/fb_posts.json
            exit 1
          fi

          MOST_RECENT=$(jq -r '.data[0].created_time // empty' /tmp/fb_posts.json)
          echo "DEBUG: post le plus récent = $MOST_RECENT"
          if [ -z "$MOST_RECENT" ]; then
            echo "::error::Aucun post trouvé sur la page Facebook — vérifier le token ou facebook.com/PerfecoNC."
            exit 1
          fi

          # ------------------------------------------------------------------
          # FENÊTRE GLISSANTE REMPLACÉE PAR LE JOUR NC (13/09/2026)
          # L'ancien test « moins de 6h » supposait une publication à 11h00 pile
          # et un contrôle à 14h00. Voir l'en-tête du workflow : ce postulat a
          # produit un faux positif le 11/09/2026.
          # ------------------------------------------------------------------
          TODAY_NC="${{ steps.day.outputs.today_nc }}"
          POST_DAY_NC=$(TZ="Pacific/Noumea" date -d "$MOST_RECENT" +%Y-%m-%d)
          echo "DEBUG: post le plus récent = $MOST_RECENT (soit le $POST_DAY_NC en heure NC)"
          if [ "$POST_DAY_NC" != "$TODAY_NC" ]; then
            echo "::error::Le post Facebook le plus récent date du $POST_DAY_NC (heure NC), pas d'aujourd'hui $TODAY_NC — aucune publication du jour n'est visible. Vérifier manuellement facebook.com/PerfecoNC."
            exit 1
          fi
          echo "fb_post_time=$MOST_RECENT" >> "$GITHUB_OUTPUT"
          echo "✅ Post Facebook du jour confirmé ($MOST_RECENT)."

      - name: Vérifier l'article WordPress (Mardi)
        id: wp_check
        if: steps.day.outputs.carrousel == 'true'
        continue-on-error: true
        env:
          WP_LOGIN: ${{ secrets.WP_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          POST_ID=$(jq -r '.wordpress_post_id // empty' automation-queue/mardi.json)
          if [ -z "$POST_ID" ] || [ "$POST_ID" = "0" ]; then
            echo "::error::wordpress_post_id absent/invalide dans automation-queue/mardi.json — impossible de vérifier l'article de cette semaine."
            exit 1
          fi

          AUTH=$(printf '%s:%s' "$WP_LOGIN" "$WP_APP_PASSWORD" | base64 -w0)
          HTTP_CODE=$(curl -s -o /tmp/wp_post.json -w "%{http_code}" -H "Authorization: Basic $AUTH" "https://perfsystemique.fr/wp-json/wp/v2/posts/$POST_ID?context=edit")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible de récupérer l'article WordPress #$POST_ID — HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(jq -r '.status' /tmp/wp_post.json)
          echo "status=$STATUS"
          if [ "$STATUS" != "publish" ]; then
            echo "::error::Article WordPress #$POST_ID toujours au statut '$STATUS' à 14h (pas 'publish') — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            exit 1
          fi

          LINK=$(jq -r '.link' /tmp/wp_post.json)
          PUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$LINK")
          if [ "$PUB_CODE" != "200" ]; then
            echo "::error::Article WordPress #$POST_ID marqué 'publish' mais l'URL publique ($LINK) répond HTTP $PUB_CODE."
            exit 1
          fi
          echo "✅ Article WordPress #$POST_ID publié et accessible ($LINK)."

      - name: Vérifier l'article perfeco.nc FR+EN (Mardi)
        id: perfeco_nc_check
        if: steps.day.outputs.carrousel == 'true'
        continue-on-error: true
        run: |
          URL_FR=$(jq -r '.perfeco_nc_url_fr // empty' automation-queue/mardi.json)
          URL_EN=$(jq -r '.perfeco_nc_url_en // empty' automation-queue/mardi.json)
          FAIL=0

          if [ -z "$URL_FR" ]; then
            echo "::error::perfeco_nc_url_fr absent de automation-queue/mardi.json."
            FAIL=1
          else
            CODE_FR=$(curl -sL -o /dev/null -w "%{http_code}" "$URL_FR")
            echo "FR ($URL_FR) -> HTTP $CODE_FR"
            if [ "$CODE_FR" != "200" ]; then
              echo "::error::Article perfeco.nc FR inaccessible — $URL_FR — HTTP $CODE_FR"
              FAIL=1
            fi
          fi

          if [ -z "$URL_EN" ]; then
            echo "::error::perfeco_nc_url_en absent de automation-queue/mardi.json."
            FAIL=1
          else
            CODE_EN=$(curl -sL -o /dev/null -w "%{http_code}" "$URL_EN")
            echo "EN ($URL_EN) -> HTTP $CODE_EN"
            if [ "$CODE_EN" != "200" ]; then
              echo "::error::Article perfeco.nc EN inaccessible — $URL_EN — HTTP $CODE_EN"
              FAIL=1
            fi
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "✅ Articles perfeco.nc FR et EN accessibles."

      - name: Vérifier que les BONS canaux ont été servis (opérations Make)
        id: social_publisher_check
        if: steps.day.outputs.publication == 'true'
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          # ------------------------------------------------------------------
          # POURQUOI CE CONTRÔLE A CHANGÉ (18/08/2026)
          #
          # L'ancienne version se contentait de vérifier qu'une exécution Make
          # récente existait et qu'elle était en statut 1 (succès). Insuffisant :
          # le 16/08/2026, la republication censée ne toucher QUE Facebook a
          # publié sur les 3 canaux (filtre FBONLY inexistant) — l'exécution
          # était bel et bien "réussie", et ce contrôle affichait ✅ pendant que
          # deux doublons LinkedIn restaient en ligne 2 jours.
          #
          # L'API Make n'expose pas le détail par module (endpoints de détail
          # testés le 18/08 : HTTP 400). En revanche le journal expose
          # `operations` = le nombre de modules réellement exécutés. C'est un
          # indicateur fiable des routes qui ont tourné.
          #
          # Correspondance établie sur données réelles le 18/08/2026 :
          #   5 opérations = 3 routes (Company + profil perso + Facebook)
          #                  observé 14/08 (vendredi) et 16/08 (l'incident)
          #   4 opérations = 2 routes (Company + Facebook, perso filtré)
          #                  observé 18/08 (mardi, après correction des filtres)
          #   3 opérations = 1 route  (Facebook seul, cas FBONLY) — ATTENDU,
          #                  jamais encore observé : le 16/08 a fait 5 au lieu de 3
          #   2 opérations + statut 3 = exécution en erreur (ex. payload corrompu
          #                  d'1 octet du 17/08)
          # ------------------------------------------------------------------
          set +e
          HTTP_CODE=$(curl -s -o /tmp/li_logs.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6916780/logs?pg%5Blimit%5D=10")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" != "0" ]; then
            echo "::error::curl a échoué (exit $CURL_EXIT) en interrogeant l'historique Make.com."
            exit 1
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger l'historique d'exécution Make.com (PerfEco Social Publisher, 6916780) — HTTP $HTTP_CODE"
            cat /tmp/li_logs.json
            exit 1
          fi

          LATEST=$(jq -c '[.scenarioLogs[] | select(.eventType=="EXECUTION_END")] | sort_by(.timestamp) | last // empty' /tmp/li_logs.json)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::Aucune exécution trouvée dans l'historique Make.com (PerfEco Social Publisher, 6916780)."
            exit 1
          fi
          TIMESTAMP=$(echo "$LATEST" | jq -r '.timestamp')
          STATUS=$(echo "$LATEST" | jq -r '.status')
          OPS=$(echo "$LATEST" | jq -r '.operations')
          FORMAT="${{ steps.day.outputs.format }}"

          # Indexé sur le FORMAT publié, plus sur le jour de la semaine : la semaine du
          # 24/09/2026 publie le lundi et le mercredi (jeudi férié NC), et un index par
          # jour aurait attendu 0 opération un jour de vraie publication.
          case "$FORMAT" in
            carrousel)     EXPECTED=4; CANAUX="LinkedIn Company + Facebook (profil perso servi hors Make, par l'API LinkedIn directe)" ;;
            # ⚠️ EXPECTED reste a 4 : le compte ne change PAS avec la decision du 15/09/2026.
            # Le bareme est « 2 operations de base + 1 par route servie » (republication 1 route = 3,
            # carrousel et post court 2 routes = 4, veille 3 routes = 5). Le post court servait
            # Company + Facebook, il sert desormais Company + profil perso : deux routes dans les
            # deux cas. Seul le LIBELLE etait perime, et il s affiche dans le message d erreur,
            # c est-a-dire au pire moment. Corrige le 23/09/2026 — ne pas « reparer » le 4.
            postcourt)     EXPECTED=4; CANAUX="LinkedIn Company + profil perso (Facebook exclu le jeudi par le suffixe -NOFB depuis le 15/09/2026 ; il recoit le meme contenu le samedi a 15h30)" ;;
            veille)        EXPECTED=5; CANAUX="LinkedIn Company + profil perso + Facebook" ;;
            republication) EXPECTED=3; CANAUX="Facebook UNIQUEMENT (republication du post court, suffixe FBONLY)" ;;
            *)             EXPECTED=0; CANAUX="(jour sans publication attendue)" ;;
          esac

          echo "Dernière exécution : $TIMESTAMP — statut=$STATUS opérations=$OPS"
          echo "Attendu aujourd'hui : $EXPECTED opérations — $CANAUX"

          # ------------------------------------------------------------------
          # FENÊTRE GLISSANTE REMPLACÉE PAR LE JOUR NC (13/09/2026)
          # Même correction que pour Facebook : on exige une exécution DU JOUR,
          # pas une exécution « de moins de 5h ». Voir l'en-tête du workflow.
          # ------------------------------------------------------------------
          TODAY_NC="${{ steps.day.outputs.today_nc }}"
          EXEC_DAY_NC=$(TZ="Pacific/Noumea" date -d "$TIMESTAMP" +%Y-%m-%d)
          echo "Exécution du $EXEC_DAY_NC (heure NC) — jour attendu : $TODAY_NC"
          if [ "$EXEC_DAY_NC" != "$TODAY_NC" ]; then
            echo "::error::La dernière exécution Make.com date du $EXEC_DAY_NC (heure NC), pas d'aujourd'hui $TODAY_NC ($TIMESTAMP) — la publication du jour n'a pas été traitée. Causes usuelles : scénario désactivé (le webhook accepte puis met en file sans exécuter), ou workflow de publication non déclenché. Vérifier eu1.make.com/1970457/scenarios/6916780 ET la page LinkedIn."
            exit 1
          fi

          if [ "$STATUS" != "1" ]; then
            echo "::error::Exécution Make.com en statut $STATUS (≠1) à $TIMESTAMP. Un statut 3 signale une erreur d'exécution — vérifier la file du webhook (eu1.make.com/1970457/hooks/3534727/queue) : un payload corrompu y bloque souvent le scénario et finit par le désactiver."
            exit 1
          fi

          if [ "$OPS" -gt "$EXPECTED" ]; then
            echo "::error::SUR-PUBLICATION — $OPS opérations au lieu de $EXPECTED. Plus de canaux que prévu ont été servis : un filtre Make ne bloque pas ce qu'il devrait. Vérifier les 2 routes LinkedIn du scénario 6916780 (elles doivent utiliser « Does not contain », jamais « Not equal to ») PUIS supprimer les publications en trop. Attendu : $CANAUX."
            exit 1
          fi
          if [ "$OPS" -lt "$EXPECTED" ]; then
            echo "::error::SOUS-PUBLICATION — $OPS opérations au lieu de $EXPECTED. Un canal attendu n'a pas été servi : filtre trop restrictif, module en erreur, ou identifiants expirés. Attendu : $CANAUX."
            exit 1
          fi

          {
            echo "make_timestamp=$TIMESTAMP"
            echo "make_status=$STATUS"
            echo "make_ops=$OPS"
            echo "make_canaux=$CANAUX"
          } >> "$GITHUB_OUTPUT"
          echo "✅ $OPS opérations = les bons canaux ont été servis ($CANAUX) — $TIMESTAMP."

      # --------------------------------------------------------------------------
      # CLÔTURE DU REGISTRE (ajoutée le 13/09/2026)
      #
      # Jusqu'ici AUCUNE routine n'écrivait le statut "publie" : il fallait le saisir
      # à la main. Toute publication réussie finissait donc mécaniquement en fausse
      # « échéance dépassée » quelques jours plus tard, et check-preparation-contenu
      # échouait pour une publication pourtant partie normalement — constaté le
      # 11/09/2026 sur le post court du jeudi 10/09.
      #
      # La clôture appartient à ce workflow parce qu'il est le seul à détenir la
      # PREUVE (exécution Make + post Facebook vérifié) au moment où elle est fiable.
      # Elle n'a donc lieu que si tous les contrôles applicables du jour sont au vert :
      # un doute sur la publication laisse l'échéance ouverte, ce qui est le but.
      # --------------------------------------------------------------------------
      - name: Clore l'échéance dans le registre des publications
        id: registre
        # La clôture est de la COMPTABILITÉ, pas un contrôle de publication : elle ne doit
        # jamais faire échouer ce workflow. Sans ce continue-on-error, une course au
        # `git push` ou une erreur du script transformerait une publication parfaitement
        # réussie en run rouge — exactement la fausse alerte que ce workflow vient de
        # cesser de produire. Son échec est visible dans le Résumé, et le registre sera
        # clos par le run du lendemain ou à la main.
        continue-on-error: true
        if: >-
          steps.day.outputs.publication == 'true' &&
          steps.day.outputs.format != 'republication' &&
          steps.fb_check.outcome == 'success' &&
          steps.social_publisher_check.outcome == 'success' &&
          steps.wp_check.outcome != 'failure' &&
          steps.perfeco_nc_check.outcome != 'failure'
        run: |
          case "${{ steps.day.outputs.format }}" in
            carrousel) FMT_REG=mardi ;;
            postcourt) FMT_REG=jeudi ;;
            veille)    FMT_REG=vendredi ;;
            *) echo "Format « ${{ steps.day.outputs.format }} » sans échéance au registre : rien à clore."; exit 0 ;;
          esac

          PREUVE="Make ${{ steps.social_publisher_check.outputs.make_ops }} operations (${{ steps.social_publisher_check.outputs.make_canaux }}) a ${{ steps.social_publisher_check.outputs.make_timestamp }} statut=${{ steps.social_publisher_check.outputs.make_status }} ; post Facebook confirme a ${{ steps.fb_check.outputs.fb_post_time }} ; cloture automatique par check-apres-publication, run ${{ github.run_id }}"

          python3 automation-agent/clore-publication.py \
            "${{ steps.day.outputs.today_nc }}" "$FMT_REG" "$PREUVE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --no-edit origin main
          git add automation-agent/publications.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: cloture registre — ${{ steps.day.outputs.format }} du ${{ steps.day.outputs.today_nc }} confirme publie"
            git push
          else
            echo "Registre déjà à jour (échéance sans doute close par un run précédent)."
          fi

      - name: Résumé
        if: always()
        run: |
          echo "Facebook : ${{ steps.fb_check.outcome || 'non applicable aujourd''hui' }}"
          echo "WordPress (perfsystemique.fr) : ${{ steps.wp_check.outcome || 'non applicable aujourd''hui' }}"
          echo "perfeco.nc (FR+EN) : ${{ steps.perfeco_nc_check.outcome || 'non applicable aujourd''hui' }}"
          echo "Canaux réellement servis (opérations Make) : ${{ steps.social_publisher_check.outcome || 'non applicable aujourd''hui' }}"
          echo "Clôture de l'échéance au registre : ${{ steps.registre.outcome || 'non applicable aujourd''hui' }}"
          if [ "${{ steps.registre.outcome }}" = "failure" ]; then
            echo "::warning::La publication est confirmée mais la clôture du registre a échoué — l'échéance reste ouverte et check-preparation-contenu la signalera. À clore à la main : python3 automation-agent/clore-publication.py <date> <mardi|jeudi|vendredi> \"<preuve>\""
          fi
          if [ "${{ steps.fb_check.outcome }}" = "failure" ] || [ "${{ steps.wp_check.outcome }}" = "failure" ] || [ "${{ steps.perfeco_nc_check.outcome }}" = "failure" ] || [ "${{ steps.social_publisher_check.outcome }}" = "failure" ]; then
            echo "::error::Au moins une publication attendue aujourd'hui n'est PAS confirmée visible — vérifier manuellement et corriger si besoin."
            exit 1
          fi
          echo "✅ Toutes les publications attendues aujourd'hui sont confirmées, sur les bons canaux."
