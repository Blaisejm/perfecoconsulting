name: PerfEco — Publication mardi (LinkedIn Company + profil perso + Facebook secours)

on:
  schedule:
    - cron: '0 0 * * 2'  # Mardi 00h00 UTC = 11h00 Nouvelle-Calédonie
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon."
            exit 1
          fi
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      - name: LinkedIn Company Page (Make.com)
        id: li_company
        continue-on-error: true
        run: |
          FILE="automation-queue/mardi.json"
          MESSAGE=$(jq -r '.linkedin_company.message' "$FILE")
          IMAGE_URL=$(jq -r '.linkedin_company.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE=$SEMAINE"

          jq -n --arg msg "$MESSAGE" --arg img "$IMAGE_URL" --arg sem "$SEMAINE" '{message:$msg, image_url:$img, semaine:$sem}' > /tmp/payload.json

          echo "DEBUG: taille du fichier payload en octets :"
          wc -c < /tmp/payload.json
          echo "DEBUG: 200 premiers caractères du payload :"
          head -c 200 /tmp/payload.json
          echo ""
          echo "DEBUG: validité JSON du payload :"
          jq empty /tmp/payload.json && echo "JSON valide" || echo "JSON INVALIDE"

          HTTP_CODE=$(curl -s -o /tmp/li.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/eq9mpaycqgaxir6eqew6514mtqcytt9d" -H "Content-Type: application/json; charset=utf-8" --data-binary @/tmp/payload.json)
          echo "HTTP $HTTP_CODE"; cat /tmp/li.txt
          [ "$HTTP_CODE" = "200" ]

      - name: Facebook (secours, uniquement si envoyer=true)
        id: facebook
        continue-on-error: true
        run: |
          FILE="automation-queue/mardi.json"
          ENVOYER=$(jq -r '.facebook.envoyer' "$FILE")
          if [ "$ENVOYER" != "true" ]; then
            echo "Ignoré (facebook.envoyer=false — déjà géré lundi)."
            exit 0
          fi
          MESSAGE=$(jq -r '.facebook.message' "$FILE")
          IMAGE_URL=$(jq -r '.facebook.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")
          PAYLOAD=$(jq -n --arg msg "$MESSAGE" --arg img "$IMAGE_URL" --arg sem "$SEMAINE" '{message:$msg, image_url:$img, semaine:$sem}')
          HTTP_CODE=$(curl -s -o /tmp/fb.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/7wp4lv77tq234ckyk6lh9npn5aoh4qlq" -H "Content-Type: application/json; charset=utf-8" -d "$PAYLOAD")
          echo "HTTP $HTTP_CODE"; cat /tmp/fb.txt
          [ "$HTTP_CODE" = "200" ]

      - name: LinkedIn profil perso (carrousel, DRAFT — appel API direct)
        id: li_profil
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          API_VERSION=$(jq -r '.linkedin_api_version' "$FILE")
          MESSAGE=$(jq -r '.linkedin_profil.message' "$FILE")

          echo "DEBUG: API_VERSION=$API_VERSION"
          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"

          URNS=()
          i=0
          while read -r URL; do
            i=$((i+1))
            echo "--- Slide $i : $URL ---"

            DL_CODE=$(curl -s -o "slide$i.png" -w "%{http_code}" "$URL")
            echo "DEBUG: téléchargement image -> HTTP $DL_CODE"
            if [ "$DL_CODE" != "200" ]; then
              echo "::error::Échec téléchargement slide $i ($URL) — HTTP $DL_CODE"
              exit 1
            fi

            jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/init_body.json
            INIT_CODE=$(curl -s -o /tmp/init.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
              -H "Authorization: Bearer $LINKEDIN_TOKEN" \
              -H "LinkedIn-Version: $API_VERSION" \
              -H "X-Restli-Protocol-Version: 2.0.0" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/init_body.json)
            echo "DEBUG: initializeUpload -> HTTP $INIT_CODE"
            cat /tmp/init.json

            UPLOAD_URL=$(jq -r '.value.uploadUrl // empty' /tmp/init.json)
            URN=$(jq -r '.value.image // empty' /tmp/init.json)

            if [ -z "$UPLOAD_URL" ]; then
              echo "::error::Échec initialisation upload slide $i — HTTP $INIT_CODE, réponse ci-dessus"
              if grep -q "NONEXISTENT_VERSION" /tmp/init.json; then
                echo "::error::426 NONEXISTENT_VERSION — mettre à jour linkedin_api_version dans automation-queue/mardi.json ET jeudi.json"
              fi
              exit 1
            fi

            PUT_CODE=$(curl -s -o /tmp/put.txt -w "%{http_code}" -X PUT "$UPLOAD_URL" -H "Authorization: Bearer $LINKEDIN_TOKEN" -H "Content-Type: image/png" --data-binary "@slide$i.png")
            echo "DEBUG: upload PUT -> HTTP $PUT_CODE"
            if [ "$PUT_CODE" != "201" ] && [ "$PUT_CODE" != "200" ]; then
              echo "::error::Échec upload PUT slide $i — HTTP $PUT_CODE"
              cat /tmp/put.txt
              exit 1
            fi

            URNS+=("$URN")
            echo "✅ Slide $i → $URN"
          done < <(jq -r '.linkedin_profil.image_urls[]' "$FILE")

          IMAGES_JSON="[]"
          idx=0
          for URN in "${URNS[@]}"; do
            idx=$((idx+1))
            IMAGES_JSON=$(echo "$IMAGES_JSON" | jq --arg alt "Slide $idx" --arg id "$URN" '. + [{altText:$alt, id:$id}]')
          done

          jq -n --arg author "$MEMBER_URN" --arg msg "$MESSAGE" --argjson images "$IMAGES_JSON" \
            '{author:$author, commentary:$msg, visibility:"PUBLIC", distribution:{feedDistribution:"MAIN_FEED", targetEntities:[], thirdPartyDistributionChannels:[]}, content:{multiImage:{images:$images}}, lifecycleState:"DRAFT"}' > /tmp/post_body.json

          echo "DEBUG: taille POST_BODY :"; wc -c < /tmp/post_body.json

          HTTP_CODE=$(curl -s -o /tmp/lip.txt -w "%{http_code}" -X POST "https://api.linkedin.com/rest/posts" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/post_body.json)

          echo "HTTP $HTTP_CODE"; cat /tmp/lip.txt
          [ "$HTTP_CODE" = "201" ]

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always()
        run: |
          echo "LinkedIn Company Page : ${{ steps.li_company.outcome }}"
          echo "Facebook : ${{ steps.facebook.outcome }}"
          echo "LinkedIn profil perso : ${{ steps.li_profil.outcome }}"
          if [ "${{ steps.li_company.outcome }}" = "failure" ] || [ "${{ steps.li_profil.outcome }}" = "failure" ] || [ "${{ steps.facebook.outcome }}" = "failure" ]; then
            echo "::error::Au moins un canal a échoué — voir les logs des étapes ci-dessus."
            exit 1
          fi
          echo "✅ Tous les canaux tentés se sont terminés sans erreur (profil perso créé en DRAFT — à finaliser manuellement sur LinkedIn)."
