name: PerfEco — Publication Facebook (lundi)

on:
  schedule:
    - cron: '0 0 * * 1'  # Lundi 00h00 UTC = 11h00 Nouvelle-Calédonie
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur et publier sur Facebook
        run: |
          set -e
          FILE="automation-queue/mardi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable — rien à publier."
            exit 1
          fi

          ENVOYER=$(jq -r '.facebook.envoyer' "$FILE")
          if [ "$ENVOYER" != "true" ]; then
            echo "facebook.envoyer=$ENVOYER — publication ignorée (déjà gérée autrement cette semaine)."
            exit 0
          fi

          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TOMORROW_NC=$(TZ="Pacific/Noumea" date -d tomorrow +%Y-%m-%d)
          if [ "$DATE_PREVUE" != "$TOMORROW_NC" ]; then
            echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à demain ($TOMORROW_NC) — contenu périmé ou pas encore mis à jour. Abandon."
            exit 1
          fi

          MESSAGE=$(jq -r '.facebook.message' "$FILE")
          IMAGE_URL=$(jq -r '.facebook.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          PAYLOAD=$(jq -n --arg msg "$MESSAGE" --arg img "$IMAGE_URL" --arg sem "$SEMAINE" '{message:$msg, image_url:$img, semaine:$sem}')

          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/7wp4lv77tq234ckyk6lh9npn5aoh4qlq" -H "Content-Type: application/json; charset=utf-8" -d "$PAYLOAD")

          echo "Réponse Make.com : HTTP $HTTP_CODE"
          cat /tmp/response.txt

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec publication Facebook — HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Facebook publié (semaine $SEMAINE) — code 200. Vérifier la page publique pour confirmation visuelle (un code 200 Make.com ne garantit pas la publication réelle si le scénario est désactivé)."

          jq '.facebook.envoyer = false' "$FILE" > /tmp/mardi_updated.json
          mv /tmp/mardi_updated.json "$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: facebook.envoyer -> false apres publication reussie du lundi (evite le doublon du secours mardi)"
          git pull --no-edit origin main
          git push origin main
