name: PerfEco — Republication Facebook (samedi, reprise du jeudi)

on:
  # RÉACTIVÉ le 18/08/2026 à la demande de Jean-Michel.
  #
  # Historique : suspendu le 18/08 au matin après l'incident du 16/08 — cette
  # republication, censée ne toucher que Facebook, était partie sur les DEUX routes
  # LinkedIn en plus, créant un doublon du post du jeudi 13/08. Cause : le suffixe
  # "-FBONLY" ne bloque rien par lui-même, et le filtre correspondant n'existait pas
  # côté Make.com.
  #
  # Depuis, le filtre a été créé sur les 2 routes LinkedIn du scénario 6916780
  # (`semaine` → "Does not contain" → "FBONLY"). ⚠️ Il n'a PAS encore tourné sur une
  # republication réelle : le premier passage en conditions réelles est le samedi
  # 22/08/2026. Il ne pouvait pas être testé avant, le contrôle de fraîcheur ci-dessous
  # exigeant que `jeudi.json` porte la date du jeudi écoulé.
  #
  # Filet de sécurité mis en place en contrepartie : `check-apres-publication.yml`
  # tourne désormais aussi le samedi à 18h30 NC (3h après) et vérifie que l'exécution
  # Make n'a consommé que 3 opérations — c'est-à-dire Facebook seul. Toute
  # sur-publication déclenche une alerte le jour même.
  #
  # PLUSIEURS DÉCLENCHEMENTS depuis le 20/11/2026 (feu vert de Jean-Michel) : le cron
  # GitHub part souvent avec 5 à 7 h de retard. Minutes peu chargées (jamais :00 ni :30).
  # HEURE CIBLE 11h00 NC depuis le 21/11/2026 (Jean-Michel : « publier de préférence
  # vers 11h en Nouvelle-Calédonie surtout pour FB ») — auparavant 15h30.
  # Le premier arrivé ATTEND 11h00 NC sur place, puis pose le tag pub-samedi-<date>
  # et publie ; les suivants voient le tag et s'arrêtent (scripts/creneau-publication.sh).
  # Après 17h00 NC, plus rien ne part : issue « alerte ».
  # Les quatre premiers créneaux sont le VENDREDI en UTC = le SAMEDI matin en NC.
  #
  # RELAIS DE VEILLEURS depuis le 22/11/2026 (accord de Jean-Michel : « Oui, le relais ») :
  # les deux crons d'ENTRÉE ci-dessous partent la VEILLE au soir (NC). Même avec 5 à 7 h
  # de retard, l'un d'eux arrive dans la nuit ; il dort par tranches de 5 h 30 et se relance
  # lui-même par workflow_dispatch (démarrage en secondes) jusqu'à 11h00 NC.
  # Les créneaux du matin restent en SECOURS si la chaîne se rompt.
  schedule:
    - cron: '47 8 * * 5'   # Vendredi 19h47 NC — entrée du relais
    - cron: '47 12 * * 5'  # Vendredi 23h47 NC — entrée du relais (secours)
    - cron: '47 20 * * 5'  # Samedi 07h47 NC — attend 11h00
    - cron: '47 21 * * 5'  # Samedi 08h47 NC — secours
    - cron: '47 22 * * 5'  # Samedi 09h47 NC — secours
    - cron: '47 23 * * 5'  # Samedi 10h47 NC — secours
    - cron: '17 1 * * 6'   # Samedi 12h17 NC — rattrapage
    - cron: '17 3 * * 6'   # Samedi 14h17 NC — rattrapage (limite 17h00)
  workflow_dispatch:

# Ajouté le 18/11/2026 (diffusion 100 % cloud, étape 1) — Jamais deux exécutions simultanées d'une même publication.
# cancel-in-progress: false = le run suivant ATTEND, il n'annule jamais celui en cours.
# issues: write depuis le 19/11/2026 : un échec ouvre une issue « alerte » (e-mail GitHub, PC éteint).
# contents: write depuis le 20/11/2026 : uniquement pour poser le tag pub-samedi-<date> (anti-doublon).
# actions: write depuis le 22/11/2026 : le veilleur se relance lui-même (workflow_dispatch).
permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: publication-samedi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Créneau — déjà publié ? sinon attendre 11h00 NC (limite 17h00)
        id: creneau
        env:
          CRENEAU_JOUR_SEMAINE: "6"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/creneau-publication.sh attendre samedi 1100 1700

      # Vendredi férié → la veille éco part CE samedi à 11h00, Facebook compris. Deux posts
      # Facebook le même jour sont interdits : la republication saute ce samedi-là
      # (cas connus : 26/12/2026 et 02/01/2027). Ajouté le 20/11/2026 avec le passage à 11h00.
      - name: Samedi de veille éco reportée ? alors pas de republication
        id: espacement
        if: steps.creneau.outputs.suite == 'publier'
        run: |
          AUJ=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          V=$(jq -r '.date_prevue // ""' automation-queue/vendredi.json 2>/dev/null)
          if [ "$V" = "$AUJ" ]; then
            echo "::notice title=Republication samedi::la veille éco du vendredi férié part aujourd'hui sur Facebook — republication SAUTÉE (jamais deux posts Facebook le même jour)."
            echo "republier=non" >> "$GITHUB_OUTPUT"
          else
            echo "republier=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier que le contenu du jeudi est bien celui de cette semaine
        id: check
        if: steps.espacement.outputs.republier == 'oui'
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable — rien à republier."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          # Le jeudi de cette semaine = samedi - 2 jours (cas normal)
          THURSDAY_NC=$(TZ="Pacific/Noumea" date -d "-2 days" +%Y-%m-%d)
          # Le mercredi = samedi - 3 jours. Élargi le 21/08/2026 : quand le jeudi est férié
          # en NC, le post court est avancé au mercredi (décision de Jean-Michel pour la
          # semaine du 24/09/2026). Sans ce cas, la republication du samedi 26/09 aurait été
          # abandonnée alors qu'un post court parfaitement valide venait d'être publié.
          WEDNESDAY_NC=$(TZ="Pacific/Noumea" date -d "-3 days" +%Y-%m-%d)
          if [ "$DATE_PREVUE" = "$THURSDAY_NC" ]; then
            echo "Contenu du jeudi $THURSDAY_NC confirmé, prêt à republier sur Facebook."
          elif [ "$DATE_PREVUE" = "$WEDNESDAY_NC" ]; then
            echo "Contenu du mercredi $WEDNESDAY_NC confirmé (semaine à jeudi férié), prêt à republier sur Facebook."
          else
            echo "::error::date_prevue=$DATE_PREVUE ne correspond ni au jeudi ($THURSDAY_NC) ni au mercredi ($WEDNESDAY_NC) de cette semaine — contenu périmé, pas encore mis à jour, ou aucune publication de post court cette semaine. Abandon (pas de republication au hasard)."
            exit 1
          fi
          # La fenêtre reste volontairement étroite (2 jours nommés, pas « les 4 derniers
          # jours ») : republier au hasard un contenu ancien serait pire que ne rien republier.

      # ── ÉTAPE 3 DE LA DIFFUSION 100 % CLOUD (19/11/2026, « lance l'étape 3 » de Jean-Michel) ──
      # Facebook est publié EN DIRECT par l'API Graph (scripts/facebook-photo.sh), sans Make.
      # Le samedi est le premier créneau basculé : un seul canal, et Make reste en repli.
      # REPLI : si l'appel direct échoue AVANT publication ou est refusé explicitement par
      # Facebook (code 2 : rien n'a été créé), l'ancien envoi Make FBONLY part à sa place.
      # Si l'envoi est parti sans réponse claire (code 1), PAS de repli (risque de doublon) :
      # l'étape échoue et l'issue « alerte » s'ouvre.
      - name: Créneau — poser le tag du jour (un seul run publie)
        id: tag
        if: steps.espacement.outputs.republier == 'oui'
        run: bash scripts/creneau-publication.sh prendre samedi

      - name: Facebook — republication EN DIRECT (API Graph)
        id: fb_direct
        if: steps.tag.outputs.suite == 'publier'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          RC=0
          bash scripts/facebook-photo.sh automation-queue/jeudi.json || RC=$?
          if [ "$RC" = "2" ]; then
            echo "repli=oui" >> "$GITHUB_OUTPUT"
            echo "::warning title=Facebook direct::échec avant publication — repli sur Make (FBONLY, étape suivante)."
            exit 0
          fi
          exit "$RC"

      - name: REPLI — republier sur Facebook par Make (seulement si l'appel direct a échoué avant publication)
        id: social
        if: steps.fb_direct.outputs.repli == 'oui'
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          if [ -z "$MAKE_WEBHOOK" ]; then
            echo "::error::Le secret MAKE_WEBHOOK est vide ou absent — publication annulee (rien envoye)."
            exit 1
          fi

          set -e
          FILE="automation-queue/jeudi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe FBONLY pour bloquer les 2 routes LinkedIn) = ${SEMAINE}-FBONLY"

          # Garde du 19/11/2026 (étape 2) : message non vide, image en 200, scénario actif — sinon rien n'est envoyé.
          bash scripts/garde-make.sh "$FILE"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$MAKE_WEBHOOK" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-FBONLY")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — Facebook uniquement, LinkedIn bloqué par les filtres Make.com."

      - name: Vérifier les résultats
        if: always() && steps.tag.outputs.suite == 'publier'
        run: |
          echo "Facebook en direct : ${{ steps.fb_direct.outcome }} (repli Make demandé : ${{ steps.fb_direct.outputs.repli || 'non' }}) — ${{ steps.fb_direct.outputs.fb_lien }}"
          echo "Repli Make : ${{ steps.social.outcome }}"
          if [ "${{ steps.fb_direct.outcome }}" = "failure" ]; then
            echo "::error::Facebook direct : état incertain — vérifier la Page AVANT tout nouvel envoi."
            exit 1
          fi
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::Le repli Make a échoué aussi — Facebook n'a reçu AUCUNE republication."
            exit 1
          fi
          echo "✅ Facebook republié avec le contenu du jeudi."

      - name: Issue « alerte » si la publication a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUJ=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          bash scripts/issue-alerte.sh "Publication samedi (republication Facebook) en échec — $AUJ" "La publication **samedi (republication Facebook)** du $AUJ a échoué (workflow \`${{ github.workflow }}\`).

          Vérifier sur les canaux ce qui est réellement parti AVANT tout nouvel envoi (pas de doublon). Le détail est dans les annotations du run ci-dessous."
