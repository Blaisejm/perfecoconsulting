name: PerfEco — Republication Facebook (samedi, reprise du jeudi)

on:
  # RÉACTIVÉ le 18/08/2026 à la demande de Jean-Michel.
  #
  # Historique : suspendu le 18/08 au matin après l'incident du 16/08 — cette
  # republication, censée ne toucher que Facebook, était partie sur les DEUX routes
  # LinkedIn en plus, créant un doublon du post du jeudi 13/08. Cause : le suffixe
  # "-FBONLY" ne bloque rien par lui-même, et le filtre correspondant n'existait pas
  # côté Make.com.
  #
  # Depuis, le filtre a été créé sur les 2 routes LinkedIn du scénario 6916780
  # (`semaine` → "Does not contain" → "FBONLY"). ⚠️ Il n'a PAS encore tourné sur une
  # republication réelle : le premier passage en conditions réelles est le samedi
  # 22/08/2026. Il ne pouvait pas être testé avant, le contrôle de fraîcheur ci-dessous
  # exigeant que `jeudi.json` porte la date du jeudi écoulé.
  #
  # Filet de sécurité mis en place en contrepartie : `check-apres-publication.yml`
  # tourne désormais aussi le samedi à 18h30 NC (3h après) et vérifie que l'exécution
  # Make n'a consommé que 3 opérations — c'est-à-dire Facebook seul. Toute
  # sur-publication déclenche une alerte le jour même.
  schedule:
    - cron: '30 4 * * 6'  # Samedi 04h30 UTC = 15h30 Nouvelle-Calédonie
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le contenu du jeudi est bien celui de cette semaine
        id: check
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable — rien à republier."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          # Le jeudi de cette semaine = samedi - 2 jours (cas normal)
          THURSDAY_NC=$(TZ="Pacific/Noumea" date -d "-2 days" +%Y-%m-%d)
          # Le mercredi = samedi - 3 jours. Élargi le 21/08/2026 : quand le jeudi est férié
          # en NC, le post court est avancé au mercredi (décision de Jean-Michel pour la
          # semaine du 24/09/2026). Sans ce cas, la republication du samedi 26/09 aurait été
          # abandonnée alors qu'un post court parfaitement valide venait d'être publié.
          WEDNESDAY_NC=$(TZ="Pacific/Noumea" date -d "-3 days" +%Y-%m-%d)
          if [ "$DATE_PREVUE" = "$THURSDAY_NC" ]; then
            echo "Contenu du jeudi $THURSDAY_NC confirmé, prêt à republier sur Facebook."
          elif [ "$DATE_PREVUE" = "$WEDNESDAY_NC" ]; then
            echo "Contenu du mercredi $WEDNESDAY_NC confirmé (semaine à jeudi férié), prêt à republier sur Facebook."
          else
            echo "::error::date_prevue=$DATE_PREVUE ne correspond ni au jeudi ($THURSDAY_NC) ni au mercredi ($WEDNESDAY_NC) de cette semaine — contenu périmé, pas encore mis à jour, ou aucune publication de post court cette semaine. Abandon (pas de republication au hasard)."
            exit 1
          fi
          # La fenêtre reste volontairement étroite (2 jours nommés, pas « les 4 derniers
          # jours ») : republier au hasard un contenu ancien serait pire que ne rien republier.

      - name: Republier sur Facebook uniquement (webhook unique, LinkedIn bloqué par filtre Make)
        id: social
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe FBONLY pour bloquer les 2 routes LinkedIn) = ${SEMAINE}-FBONLY"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/bp97dhwfnsx2yxmxr8sguhlvrdjl6kx6" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-FBONLY")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE"
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — Facebook uniquement, LinkedIn bloqué par les filtres Make.com."

      - name: Vérifier les résultats
        if: always()
        run: |
          echo "Republication Facebook : ${{ steps.social.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::L'appel au webhook a échoué — voir les logs ci-dessus."
            exit 1
          fi
          echo "✅ Facebook republié avec le contenu du jeudi."
