name: PerfEco — Publication jeudi (post court, webhook unique)

on:
  schedule:
    - cron: '0 0 * * 4'  # Jeudi 00h00 UTC = 11h00 Nouvelle-Calédonie (cas normal)
    - cron: '0 0 * * 3'  # Mercredi 00h00 UTC = 11h00 NC — décalages exceptionnels (voir ci-dessous)
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE MERCREDI (ajouté le 21/08/2026)
#
# Décision de Jean-Michel pour la semaine du 24/09/2026 : le jeudi 24/09 étant férié en
# Nouvelle-Calédonie (Fête de la Citoyenneté), le post court est avancé au MERCREDI 23/09
# (et le post long au lundi 21/09).
#
# CE CRON SUPPLÉMENTAIRE NE FAIT PAS ÉCHOUER LE WORKFLOW LES AUTRES SEMAINES, mais
# cela a demandé un correctif : la garde de fraîcheur sortait en `exit 1` dès que la
# date ne correspondait pas, donc le workflow aurait échoué tous les mercredis. Elle
# distingue désormais deux cas — un écart le jeudi (jour habituel) reste une anomalie
# bruyante, un écart le jour de rattrapage est une sortie normale (`publier=false`,
# étapes suivantes sautées). Sans cette distinction, une alerte hebdomadaire sans objet
# aurait fini par noyer les vraies.
#
# L'étape de contrôle ci-dessous exige que
# `date_prevue` soit exactement la date du jour en NC. Tous les autres mercredis, la file
# porte une date de jeudi et le run s'arrête proprement sans rien publier.
#
# 🔗 CONSÉQUENCE À NE PAS OUBLIER : publish-samedi-republication-facebook.yml reprend le
# post court du jeudi et exigeait que `date_prevue` vaille samedi − 2 jours. Sa garde a été
# élargie le même jour pour accepter aussi samedi − 3 (mercredi), sans quoi la
# republication du samedi 26/09 aurait été abandonnée.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        id: fraicheur
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            # Deux situations très différentes, à ne pas confondre (corrigé le 21/08/2026) :
            if [ "$DOW" = "4" ]; then
              # Jeudi, le jour habituel : la file DEVRAIT porter la date du jour.
              # Un écart ici est une vraie anomalie — c'est le filet qui a rattrapé
              # plusieurs bascules ratées. On échoue bruyamment.
              echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon."
              exit 1
            fi
            # Mercredi : jour ajouté pour absorber les décalages de férié. Rien à publier
            # ici la plupart des semaines — c'est le cas NORMAL, surtout pas une erreur.
            # Sans cette distinction, le workflow échouerait chaque semaine et noierait
            # les vraies alertes.
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Rien à publier aujourd'hui : la file vise le $DATE_PREVUE, nous sommes le $TODAY_NC. Sortie normale."
            exit 0
          fi
          echo "publier=true" >> "$GITHUB_OUTPUT"
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      # ⚠️ RÉPARÉ LE 19/09/2026 par perfeco-rappel-quotidien.
      # Le commit 421f204 du 15/09/2026 avait collé le bloc de commentaires ci-dessous
      # À L'INTÉRIEUR du `if` ci-dessus, en effaçant ses 18 lignes de logique. Le script
      # se terminait donc sur un `if ...; then` jamais fermé : erreur de syntaxe bash,
      # étape « Vérifier la fraîcheur du contenu » en échec, étape de publication SAUTÉE.
      # Coût réel : le post court du jeudi 17/09/2026 n'a jamais été publié (run #9,
      # conclusion=failure), et le run du mercredi 16/09 (#8) a échoué pour la même raison
      # alors qu'il aurait dû sortir proprement en `publier=false`.
      # Leçon : un bloc de commentaires déplacé ne se voit pas à la relecture d'un diff,
      # mais il casse le script AU PARSING — même classe de panne silencieuse que les
      # .ps1 sans BOM. Toute modification d'un `run:` doit être relue en entier, pas en diff.
      # ────────────────────────────────────────────────────────────────────────
      # ── CHANGEMENT DU 15/09/2026, décision de Jean-Michel ──────────────────────
      # Le jeudi publie désormais sur LinkedIn Company Page ET LinkedIn profil perso,
      # puis le MÊME post part sur Facebook le SAMEDI (publish-samedi-republication-facebook.yml,
      # 15h30 NC). Facebook ne reçoit donc plus rien le jeudi.
      #
      # Ce que ça change par rapport à la version précédente :
      #   - le suffixe "-NOCAROUSEL" (qui excluait le profil perso depuis le 17/08) est RETIRÉ ;
      #   - un suffixe "-NOFB" le remplace, pour exclure Facebook.
      #
      # ⚠️ DÉPENDANCE MAKE.COM — sans elle, ce suffixe ne fait RIEN.
      # Un suffixe ne bloque une route que si un filtre correspondant existe côté Make
      # (leçon du 16/08/2026 : "-FBONLY" sans filtre avait produit un doublon LinkedIn).
      # Filtre à créer sur le scénario 6916780, route **Facebook** :
      #       semaine  →  "Does not contain"  →  NOFB
      # Tant que ce filtre n'existe pas, Facebook continue de recevoir le jeudi ET la
      # republication du samedi — c'est-à-dire le doublon relevé le 23/08/2026.
      #
      # La règle des 48 h d'espacement sur le profil perso est ABANDONNÉE par la même
      # décision : le profil reçoit désormais mardi, jeudi et vendredi.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Publication réseaux sociaux (webhook unique — LinkedIn Company + profil perso ; Facebook exclu, il reçoit le samedi)
        id: social
        if: steps.fraicheur.outputs.publier == 'true'
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
        run: |
          if [ -z "$MAKE_WEBHOOK" ]; then
            echo "::error::Le secret MAKE_WEBHOOK est vide ou absent — publication annulee (rien envoye)."
            exit 1
          fi

          set -e
          FILE="automation-queue/jeudi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe NOFB pour bloquer la route Facebook) = ${SEMAINE}-NOFB"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$MAKE_WEBHOOK" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-NOFB")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE. NB : un code 200 'Accepted' ne garantit pas la publication réelle si le scénario Make.com est désactivé — vérifier check-apres-publication.yml cet après-midi."
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — vérification réelle faite par check-apres-publication.yml."

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always()
        run: |
          echo "Publication réseaux sociaux : ${{ steps.social.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::L'appel au webhook a échoué — voir les logs ci-dessus."
            exit 1
          fi
          echo "✅ Appel webhook réussi (LinkedIn Company + profil perso). Facebook reçoit le même post le samedi 15h30 NC."
