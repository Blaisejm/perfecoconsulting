name: PerfEco — Publication jeudi (post court, webhook unique)

on:
  schedule:
    - cron: '0 0 * * 4'  # Jeudi 00h00 UTC = 11h00 Nouvelle-Calédonie (cas normal)
    - cron: '0 0 * * 3'  # Mercredi 00h00 UTC = 11h00 NC — décalages exceptionnels (voir ci-dessous)
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE MERCREDI (ajouté le 21/08/2026)
#
# Décision de Jean-Michel pour la semaine du 24/09/2026 : le jeudi 24/09 étant férié en
# Nouvelle-Calédonie (Fête de la Citoyenneté), le post court est avancé au MERCREDI 23/09
# (et le post long au lundi 21/09).
#
# CE CRON SUPPLÉMENTAIRE EST SANS EFFET DE BORD : l'étape de contrôle ci-dessous exige que
# `date_prevue` soit exactement la date du jour en NC. Tous les autres mercredis, la file
# porte une date de jeudi et le run s'arrête proprement sans rien publier.
#
# 🔗 CONSÉQUENCE À NE PAS OUBLIER : publish-samedi-republication-facebook.yml reprend le
# post court du jeudi et exigeait que `date_prevue` vaille samedi − 2 jours. Sa garde a été
# élargie le même jour pour accepter aussi samedi − 3 (mercredi), sans quoi la
# republication du samedi 26/09 aurait été abandonnée.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon."
            exit 1
          fi
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      # ⚠️ Depuis le 17/08/2026 (décision Jean-Michel) : le post court du jeudi ne part PLUS
      # sur le profil perso — uniquement LinkedIn Company Page + Facebook.
      # Objectif : garantir un minimum de 48h entre deux posts du profil perso
      # (avant : carrousel mardi → post court jeudi → veille éco vendredi = 24h entre jeudi et vendredi).
      # Le profil perso ne reçoit donc plus que 2 posts/semaine : mardi (carrousel) et vendredi (veille éco).
      # Mécanisme : suffixe "-NOCAROUSEL" sur le champ `semaine`, filtré côté Make.com sur la route
      # "LinkedIn perso" — même levier que publish-mardi-carrousel.yml, déjà éprouvé en production.
      # Pour revenir en arrière (fin du test) : retirer le suffixe ci-dessous, rien d'autre à changer.
      - name: Publication réseaux sociaux (webhook unique — LinkedIn Company + Facebook, profil perso exclu)
        id: social
        run: |
          set -e
          FILE="automation-queue/jeudi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE (avec suffixe NOCAROUSEL pour bloquer la route profil perso) = ${SEMAINE}-NOCAROUSEL"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/bp97dhwfnsx2yxmxr8sguhlvrdjl6kx6" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=${SEMAINE}-NOCAROUSEL")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE. NB : un code 200 'Accepted' ne garantit pas la publication réelle si le scénario Make.com est désactivé — vérifier check-apres-publication.yml cet après-midi."
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — vérification réelle faite par check-apres-publication.yml."

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always()
        run: |
          echo "Publication réseaux sociaux : ${{ steps.social.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::L'appel au webhook a échoué — voir les logs ci-dessus."
            exit 1
          fi
          echo "✅ Appel webhook réussi (LinkedIn Company + Facebook — profil perso volontairement exclu depuis le 17/08/2026)."
