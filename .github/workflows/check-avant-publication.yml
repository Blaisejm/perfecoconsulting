name: PerfEco — Vérification santé pré-publication (Make.com, API LinkedIn, WordPress)

on:
  schedule:
    - cron: '0 20 * * 0,1,2,3,4'  # Dim→Jeu 20h00 UTC = Lun→Ven 07h00 Nouvelle-Calédonie (avant chaque jour de publication)
  # Le mardi 20h UTC (= mercredi 07h NC) a été ajouté le 21/08/2026 : la semaine du
  # 24/09/2026 publie le lundi et le mercredi (jeudi 24/09 férié en NC), et le mercredi
  # n'était couvert par aucune vérification avant publication. Les autres semaines, ce run
  # vérifie l'infrastructure (scénario Make actif, token LinkedIn valide) — utile tous les
  # jours et sans faux positif.
  workflow_dispatch:
    inputs:
      force_wp_check:
        description: "Forcer la vérification WordPress même si ce n'est pas mardi (test manuel)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier scénario PerfEco Social Publisher (6916780)
        id: social_publisher
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/sp.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6916780")
          echo "HTTP $HTTP_CODE"; cat /tmp/sp.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger le scénario PerfEco Social Publisher (6916780) — HTTP $HTTP_CODE"
            exit 1
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/sp.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" != "true" ]; then
            echo "::error::Scénario PerfEco Social Publisher (6916780) INACTIF — https://eu1.make.com/1970457/scenarios/6916780/edit — vérifier la queue puis réactiver. Rappel : plan Make.com limité à 2 scénarios actifs, vérifier qu'aucun 3e n'a été activé par erreur."
            exit 1
          fi
          echo "✅ Scénario PerfEco Social Publisher actif."

      # Ajoutee le 15/09/2026. Motif : le 16/08/2026, un filtre EXISTAIT sur la route
      # "LinkedIn perso" mais etait regle sur "Not equal to" au lieu de "Does not contain" —
      # inoperant sur une valeur suffixee (le champ vaut "W33-NOCAROUSEL", pas "NOCAROUSEL").
      # Resultat : un doublon LinkedIn. Croire un filtre present ne suffit pas, il faut
      # verifier son OPERATEUR. Ce controle tourne avant chaque publication.
      - name: Vérifier les filtres de routes Make (opérateur « Does not contain »)
        id: make_filtres
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/bp.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6916780/blueprint")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible de lire le blueprint du scenario 6916780 (HTTP $HTTP_CODE) — filtres de routes NON verifies."
            exit 1
          fi
          # Toute condition de filtre Make a la forme {"a": <champ>, "b": <valeur>, "o": <operateur>}
          jq -r '[.. | objects | select(has("o") and has("b")) | "\(.o)|\(.b)"] | .[]' /tmp/bp.json > /tmp/conds.txt || true
          echo "--- conditions de filtre trouvees ---"; cat /tmp/conds.txt
          FAIL=0
          for SUF in NOFB FBONLY NOCAROUSEL; do
            LIGNE=$(grep -i "|.*${SUF}" /tmp/conds.txt | head -1 || true)
            if [ -z "$LIGNE" ]; then
              echo "::error::Filtre « $SUF » ABSENT du scenario 6916780. Le suffixe envoye par le workflow ne bloquera RIEN."
              FAIL=1
              continue
            fi
            OP=$(echo "$LIGNE" | cut -d'|' -f1)
            case "$OP" in
              *notcontain*) echo "✅ $SUF — operateur « $OP » (Does not contain) : correct." ;;
              *) echo "::error::Filtre « $SUF » present mais operateur « $OP » — attendu « text:notcontain » (Does not contain). Sur une valeur suffixee, « Not equal to » NE BLOQUE RIEN (incident du 16/08/2026)."; FAIL=1 ;;
            esac
          done
          if [ "$FAIL" = "1" ]; then
            echo "Corriger ici : https://eu1.make.com/1970457/scenarios/6916780/edit"
            exit 1
          fi
          echo "✅ Les 3 filtres de routes sont presents et correctement configures."

      - name: Vérifier version API LinkedIn (426 NONEXISTENT_VERSION — utilisée pour le carrousel DRAFT du mardi)
        id: li_version
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          # Source unique depuis le 21/09/2026 : automation-agent/calendrier.json.
          # La file d'attente ne sert plus que de repli.
          CALENDRIER="automation-agent/calendrier.json"
          # `|| true` indispensable : les `run:` tournent sous `bash -e`, une
          # substitution en échec tuerait l'étape avant d'atteindre le repli.
          API_VERSION=$(jq -r '.linkedin.api_version // empty' "$CALENDRIER" 2>/dev/null || true)
          SOURCE_VERSION="$CALENDRIER"
          if [ -z "$API_VERSION" ]; then
            API_VERSION=$(jq -r '.linkedin_api_version // empty' automation-queue/mardi.json 2>/dev/null || true)
            SOURCE_VERSION="automation-queue/mardi.json (REPLI)"
            echo "::warning::.linkedin.api_version absent de $CALENDRIER — repli sur la file d'attente. Rétablir la source unique."
          fi
          echo "DEBUG: API_VERSION=$API_VERSION (source : $SOURCE_VERSION)"

          jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/li_version_body.json
          HTTP_CODE=$(curl -s -o /tmp/li_version.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/li_version_body.json)
          echo "HTTP $HTTP_CODE"; cat /tmp/li_version.json

          if [ "$HTTP_CODE" = "426" ] || grep -q "NONEXISTENT_VERSION" /tmp/li_version.json; then
            # Ne PAS suggerer le mois courant : le test du 22/09/2026 a etabli que
            # 202512 n'a JAMAIS ete publiee, alors que 202511 et 202601 l'encadrent,
            # vivantes. LinkedIn ne sort pas une version chaque mois, et l'erreur
            # s'appelle litteralement NONEXISTENT_VERSION. Conseiller « le mois
            # courant » reviendrait donc, un mois de trou, a proposer une valeur qui
            # casse la publication le jour meme. On CHERCHE la plus recente publiee.
            #
            # Sonde en LECTURE : 426 = morte, 403/200 = vivante (403 = scope de
            # lecture absent, le token ne portant que w_member_social).
            SUGGEREE=""
            BASE_MOIS=$(TZ="Pacific/Noumea" date +%Y-%m-01)
            for RECUL in $(seq 0 13); do
              CANDIDATE=$(date -u -d "$BASE_MOIS -$RECUL month" +%Y%m 2>/dev/null || true)
              if [ -z "$CANDIDATE" ]; then continue; fi
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.linkedin.com/rest/me"                 -H "Authorization: Bearer $LINKEDIN_TOKEN"                 -H "LinkedIn-Version: $CANDIDATE"                 -H "X-Restli-Protocol-Version: 2.0.0" || true)
              if [ "$CODE" = "403" ] || [ "$CODE" = "200" ]; then SUGGEREE="$CANDIDATE"; break; fi
            done
            if [ -n "$SUGGEREE" ]; then
              CONSEIL="Version publiee la plus recente trouvee a l'instant : $SUGGEREE."
            else
              CONSEIL="Aucune version vivante trouvee sur 14 mois : verifier d'abord LINKEDIN_TOKEN (un 401 se lit comme un echec ici)."
            fi
            echo "::error::linkedin_api_version=$API_VERSION expiré (426 NONEXISTENT_VERSION) — mettre à jour .linkedin.api_version dans automation-agent/calendrier.json (format AAAAMM), et y reporter la date dans api_version_maj_le. $CONSEIL NE PAS prendre le mois courant de confiance : certains mois ne sont jamais publiés (cas de 202512). C'est la SOURCE UNIQUE depuis le 21/09/2026 : ne plus corriger automation-queue/mardi.json, qui n'est qu'un repli."
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Appel initializeUpload LinkedIn inattendu — HTTP $HTTP_CODE (voir réponse ci-dessus). Vérifier LINKEDIN_TOKEN ou la disponibilité de l'API LinkedIn."
            exit 1
          fi

          echo "✅ Version API LinkedIn ($API_VERSION) valide."

      - name: Vérifier l'article WordPress avant publication (mardi 11h03)
        id: wp_check
        continue-on-error: true
        env:
          WP_LOGIN: ${{ secrets.WP_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          CARROUSEL_DATE=$(jq -r '.date_prevue // ""' automation-queue/mardi.json 2>/dev/null)
          # Indexé sur la date du carrousel, plus sur « est-on mardi ? » (21/08/2026) :
          # l'article WordPress accompagne le CARROUSEL, quel que soit le jour où il sort.
          # La semaine du 24/09/2026 le publie un lundi — l'ancien test l'aurait ignoré.
          if [ "$CARROUSEL_DATE" != "$TODAY_NC" ] && [ "${{ inputs.force_wp_check }}" != "true" ]; then
            echo "Le carrousel n'est pas publié aujourd'hui (file=$CARROUSEL_DATE, aujourd'hui=$TODAY_NC) — aucun article WordPress à vérifier."
            exit 0
          fi

          FILE="automation-queue/mardi.json"
          POST_ID=$(jq -r '.wordpress_post_id // empty' "$FILE")
          if [ -z "$POST_ID" ]; then
            echo "::error::Champ wordpress_post_id absent de $FILE — impossible de vérifier l'article avant la publication de 11h03."
            exit 1
          fi

          AUTH=$(printf '%s:%s' "$WP_LOGIN" "$WP_APP_PASSWORD" | base64 -w0)
          HTTP_CODE=$(curl -s -o /tmp/wp_post.json -w "%{http_code}" -H "Authorization: Basic $AUTH" "https://perfsystemique.fr/wp-json/wp/v2/posts/$POST_ID?context=edit")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible de récupérer l'article WordPress #$POST_ID — HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(jq -r '.status' /tmp/wp_post.json)
          CATEGORIES=$(jq -r '.categories | join(",")' /tmp/wp_post.json)
          TAGS_COUNT=$(jq -r '.tags | length' /tmp/wp_post.json)
          echo "status=$STATUS categories=$CATEGORIES tags_count=$TAGS_COUNT"

          FAIL=0
          if [ "$STATUS" != "future" ] && [ "$STATUS" != "publish" ]; then
            echo "::error::Article WordPress #$POST_ID a le statut '$STATUS' (attendu : future ou publish) — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi
          if [ "$CATEGORIES" = "1" ] || [ -z "$CATEGORIES" ]; then
            echo "::error::Article WordPress #$POST_ID est encore dans la catégorie 'Uncategorized' (ID 1) ou sans catégorie — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi
          if [ "$TAGS_COUNT" = "0" ]; then
            echo "::error::Article WordPress #$POST_ID n'a aucune étiquette — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "✅ Article WordPress #$POST_ID prêt (statut=$STATUS, catégorie(s)=$CATEGORIES, $TAGS_COUNT étiquette(s))."

      - name: Résumé
        if: always()
        run: |
          echo "PerfEco Social Publisher : ${{ steps.social_publisher.outcome }}"
          echo "Filtres de routes Make : ${{ steps.make_filtres.outcome }}"
          echo "Version API LinkedIn (carrousel mardi) : ${{ steps.li_version.outcome }}"
          echo "Article WordPress : ${{ steps.wp_check.outcome }}"
          if [ "${{ steps.social_publisher.outcome }}" = "failure" ] || [ "${{ steps.make_filtres.outcome }}" = "failure" ] || [ "${{ steps.li_version.outcome }}" = "failure" ] || [ "${{ steps.wp_check.outcome }}" = "failure" ]; then
            echo "::error::Au moins une vérification a échoué — voir logs ci-dessus. Corriger AVANT le prochain lancement de publication."
            exit 1
          fi
          echo "✅ Scénario Make.com actif, version API LinkedIn valide, article WordPress prêt (si mardi)."
