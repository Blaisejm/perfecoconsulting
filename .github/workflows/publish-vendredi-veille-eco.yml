name: PerfEco — Publication vendredi (veille économique, webhook unique)

on:
  # PLUSIEURS DÉCLENCHEMENTS depuis le 22/11/2026 (feu vert de Jean-Michel ; heure cible
  # 11h00 NC) : le cron GitHub part avec 5 h de retard ou plus. Le premier arrivé
  # ATTEND 11h00 NC, pose le tag pub-vendredi-<date> et publie ; les suivants voient le tag
  # et s'arrêtent (scripts/creneau-publication.sh). Après 17h00 NC, rien ne part : alerte.
  # Les créneaux de la VEILLE en UTC sont le matin du jour J en NC.
  schedule:
    # Vendredi NC (cas normal)
    - cron: '47 20 * * 4'  # Vendredi 07h47 NC — attend 11h00
    - cron: '47 21 * * 4'  # Vendredi 08h47 NC — secours
    - cron: '47 22 * * 4'  # Vendredi 09h47 NC — secours
    - cron: '47 23 * * 4'  # Vendredi 10h47 NC — secours
    - cron: '17 1 * * 5'   # Vendredi 12h17 NC — rattrapage
    - cron: '17 3 * * 5'   # Vendredi 14h17 NC — rattrapage (limite 17h00)
    # Samedi NC — vendredi férié (voir ci-dessous) ; à vide les autres semaines
    - cron: '47 20 * * 5'  # Samedi 07h47 NC
    - cron: '47 22 * * 5'  # Samedi 09h47 NC
    - cron: '17 1 * * 6'   # Samedi 12h17 NC — rattrapage
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE SAMEDI (ajouté le 21/08/2026)
#
# Règle générale posée par Jean-Michel : **si le vendredi est férié, la veille économique
# bascule au samedi.** Deux cas connus sur les six prochains mois, tous deux un vendredi :
# Noël (25/12/2026) → samedi 26/12, et le Jour de l'An (01/01/2027) → samedi 02/01.
#
# Même mécanique que les crons lundi/mercredi des deux autres publications : un écart de
# date le VENDREDI reste une anomalie bruyante, un écart le samedi est une sortie normale.
#
# TÉLESCOPAGE RÉGLÉ LE 20/11/2026 : la republication Facebook du samedi vise elle aussi
# 11h00 NC. Un samedi de bascule (vendredi férié), publish-samedi-republication-facebook.yml
# voit que vendredi.json porte la date du jour et SAUTE la republication : jamais deux posts
# Facebook le même jour.

# Ajouté le 18/11/2026 (diffusion 100 % cloud, étape 1) — Jamais deux exécutions simultanées d'une même publication.
# cancel-in-progress: false = le run suivant ATTEND, il n'annule jamais celui en cours.
# issues: write depuis le 19/11/2026 : un échec ouvre une issue « alerte » (e-mail GitHub, PC éteint).
# contents: write depuis le 22/11/2026 : uniquement pour poser le tag pub-vendredi-<date> (anti-doublon).
permissions:
  contents: write
  issues: write

concurrency:
  group: publication-vendredi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        id: fraicheur
        run: |
          set -e
          FILE="automation-queue/vendredi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable — rien à publier."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            if [ "$DOW" = "5" ]; then
              # Vendredi, le jour habituel : un écart est une vraie anomalie.
              echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon (contenu périmé ou pas encore mis à jour)."
              exit 1
            fi
            # Samedi : jour de repli quand le vendredi est férié. Rien à publier la
            # plupart des semaines — cas NORMAL, pas une erreur.
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Rien à publier aujourd'hui : la file vise le $DATE_PREVUE, nous sommes le $TODAY_NC. Sortie normale."
            exit 0
          fi
          echo "publier=true" >> "$GITHUB_OUTPUT"
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      - name: Créneau — déjà publié ? sinon attendre 11h00 NC (limite 17h00)
        id: creneau
        if: steps.fraicheur.outputs.publier == 'true'
        run: bash scripts/creneau-publication.sh attendre vendredi 1100 1700

      - name: Créneau — poser le tag du jour (un seul run publie)
        id: tag
        if: steps.creneau.outputs.suite == 'publier'
        run: bash scripts/creneau-publication.sh prendre vendredi

      - name: Publication réseaux sociaux (webhook unique — LinkedIn Company + LinkedIn perso + Facebook)
        id: social
        if: steps.tag.outputs.suite == 'publier'
        env:
          MAKE_WEBHOOK: ${{ secrets.MAKE_WEBHOOK }}
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          if [ -z "$MAKE_WEBHOOK" ]; then
            echo "::error::Le secret MAKE_WEBHOOK est vide ou absent — publication annulee (rien envoye)."
            exit 1
          fi

          set -e
          FILE="automation-queue/vendredi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE=$SEMAINE"

          # Garde du 19/11/2026 (étape 2) : message non vide, image en 200, scénario actif — sinon rien n'est envoyé.
          bash scripts/garde-make.sh "$FILE"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$MAKE_WEBHOOK" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=$SEMAINE")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE. NB : un code 200 'Accepted' ne garantit pas la publication réelle si le scénario Make.com est désactivé — vérifier check-apres-publication.yml cet après-midi."
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — vérification réelle faite par check-apres-publication.yml."

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always() && steps.tag.outputs.suite == 'publier'
        run: |
          echo "Publication réseaux sociaux : ${{ steps.social.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::L'appel au webhook a échoué — voir les logs ci-dessus."
            exit 1
          fi
          echo "✅ Appel webhook réussi (LinkedIn Company + LinkedIn perso + Facebook, même message/image)."

      - name: Issue « alerte » si la publication a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUJ=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          bash scripts/issue-alerte.sh "Publication vendredi (veille éco) en échec — $AUJ" "La publication **vendredi (veille éco)** du $AUJ a échoué (workflow \`${{ github.workflow }}\`).

          Vérifier sur les canaux ce qui est réellement parti AVANT tout nouvel envoi (pas de doublon). Le détail est dans les annotations du run ci-dessous."
