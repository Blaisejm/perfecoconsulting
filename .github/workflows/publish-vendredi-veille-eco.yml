name: PerfEco — Publication vendredi (veille économique, webhook unique)

on:
  schedule:
    - cron: '0 0 * * 5'  # Vendredi 00h00 UTC = 11h00 Nouvelle-Calédonie (cas normal)
    - cron: '0 0 * * 6'  # Samedi 00h00 UTC = 11h00 NC — vendredi férié (voir ci-dessous)
  workflow_dispatch:

# ⚠️ POURQUOI UN CRON LE SAMEDI (ajouté le 21/08/2026)
#
# Règle générale posée par Jean-Michel : **si le vendredi est férié, la veille économique
# bascule au samedi.** Deux cas connus sur les six prochains mois, tous deux un vendredi :
# Noël (25/12/2026) → samedi 26/12, et le Jour de l'An (01/01/2027) → samedi 02/01.
#
# Même mécanique que les crons lundi/mercredi des deux autres publications : un écart de
# date le VENDREDI reste une anomalie bruyante, un écart le samedi est une sortie normale.
#
# ⚠️ TÉLESCOPAGE À SURVEILLER CES SAMEDIS-LÀ : publish-samedi-republication-facebook.yml
# republie le post court sur Facebook à 15h30 NC. Un samedi de bascule, Facebook recevrait
# donc DEUX posts le même jour (veille éco 11h + republication 15h30). LinkedIn n'est pas
# concerné (la republication est filtrée FBONLY), mais la règle d'espacement vise aussi
# Facebook : suspendre la republication ce samedi-là, ou l'assumer explicitement.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la fraîcheur du contenu
        id: fraicheur
        run: |
          set -e
          FILE="automation-queue/vendredi.json"
          if [ ! -f "$FILE" ]; then
            echo "::error::Fichier $FILE introuvable — rien à publier."
            exit 1
          fi
          DATE_PREVUE=$(jq -r '.date_prevue' "$FILE")
          TODAY_NC=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
          DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$DATE_PREVUE" != "$TODAY_NC" ]; then
            if [ "$DOW" = "5" ]; then
              # Vendredi, le jour habituel : un écart est une vraie anomalie.
              echo "::error::date_prevue=$DATE_PREVUE ne correspond pas à aujourd'hui NC ($TODAY_NC). Abandon (contenu périmé ou pas encore mis à jour)."
              exit 1
            fi
            # Samedi : jour de repli quand le vendredi est férié. Rien à publier la
            # plupart des semaines — cas NORMAL, pas une erreur.
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Rien à publier aujourd'hui : la file vise le $DATE_PREVUE, nous sommes le $TODAY_NC. Sortie normale."
            exit 0
          fi
          echo "publier=true" >> "$GITHUB_OUTPUT"
          echo "Contenu à jour pour aujourd'hui ($TODAY_NC)."

      - name: Publication réseaux sociaux (webhook unique — LinkedIn Company + LinkedIn perso + Facebook)
        id: social
        if: steps.fraicheur.outputs.publier == 'true'
        run: |
          set -e
          FILE="automation-queue/vendredi.json"
          MESSAGE=$(jq -r '.social_post.message' "$FILE")
          IMAGE_URL=$(jq -r '.social_post.image_url' "$FILE")
          SEMAINE=$(jq -r '.semaine' "$FILE")

          echo "DEBUG: longueur MESSAGE=${#MESSAGE} caractères"
          echo "DEBUG: IMAGE_URL=$IMAGE_URL"
          echo "DEBUG: SEMAINE=$SEMAINE"

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "https://hook.eu1.make.com/bp97dhwfnsx2yxmxr8sguhlvrdjl6kx6" \
            --data-urlencode "message=$MESSAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "semaine=$SEMAINE")

          echo "HTTP $HTTP_CODE"; cat /tmp/resp.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Échec de l'appel webhook — HTTP $HTTP_CODE. NB : un code 200 'Accepted' ne garantit pas la publication réelle si le scénario Make.com est désactivé — vérifier check-apres-publication.yml cet après-midi."
            exit 1
          fi
          echo "✅ Webhook accepté (HTTP 200) — vérification réelle faite par check-apres-publication.yml."

      - name: Vérifier les résultats et faire échouer le job si besoin
        if: always()
        run: |
          echo "Publication réseaux sociaux : ${{ steps.social.outcome }}"
          if [ "${{ steps.social.outcome }}" = "failure" ]; then
            echo "::error::L'appel au webhook a échoué — voir les logs ci-dessus."
            exit 1
          fi
          echo "✅ Appel webhook réussi (LinkedIn Company + LinkedIn perso + Facebook, même message/image)."
