name: PerfEco — Vérification santé Make.com & API LinkedIn

on:
  schedule:
    - cron: '0 20 * * 0,1,3'  # Dim/Lun/Mer 20h00 UTC = Lun/Mar/Jeu 07h00 Nouvelle-Calédonie (avant chaque jour de publication)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier scénario Facebook (Integration Webhooks — 6233263)
        id: fb
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/fb.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6233263")
          echo "HTTP $HTTP_CODE"; cat /tmp/fb.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger le scénario Facebook (6233263) — HTTP $HTTP_CODE"
            exit 1
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/fb.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" != "true" ]; then
            echo "::error::Scénario Facebook (Integration Webhooks, 6233263) INACTIF — https://eu1.make.com/1970457/scenarios/6233263/edit — vérifier la queue puis réactiver."
            exit 1
          fi
          echo "✅ Scénario Facebook actif."

      - name: Vérifier scénario LinkedIn (Integration Webhooks, LinkedIn — 6249513)
        id: li
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/li.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6249513")
          echo "HTTP $HTTP_CODE"; cat /tmp/li.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger le scénario LinkedIn (6249513) — HTTP $HTTP_CODE"
            exit 1
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/li.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" != "true" ]; then
            echo "::error::Scénario LinkedIn (Integration Webhooks, LinkedIn, 6249513) INACTIF — https://eu1.make.com/1970457/scenarios/6249513/edit — vérifier la queue puis réactiver."
            exit 1
          fi
          echo "✅ Scénario LinkedIn actif."

      - name: Vérifier version API LinkedIn (426 NONEXISTENT_VERSION)
        id: li_version
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          API_VERSION=$(jq -r '.linkedin_api_version' automation-queue/mardi.json)
          echo "DEBUG: API_VERSION=$API_VERSION (source : automation-queue/mardi.json)"

          if [ -f automation-queue/jeudi.json ]; then
            API_VERSION_JEUDI=$(jq -r '.linkedin_api_version' automation-queue/jeudi.json)
            if [ "$API_VERSION_JEUDI" != "$API_VERSION" ]; then
              echo "::warning::linkedin_api_version diffère entre mardi.json ($API_VERSION) et jeudi.json ($API_VERSION_JEUDI) — à aligner."
            fi
          fi

          jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/li_version_body.json
          HTTP_CODE=$(curl -s -o /tmp/li_version.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/li_version_body.json)
          echo "HTTP $HTTP_CODE"; cat /tmp/li_version.json

          if [ "$HTTP_CODE" = "426" ] || grep -q "NONEXISTENT_VERSION" /tmp/li_version.json; then
            echo "::error::linkedin_api_version=$API_VERSION expiré (426 NONEXISTENT_VERSION) — mettre à jour automation-queue/mardi.json ET jeudi.json avec une version récente (format AAAAMM, ex. $(date +%Y%m))."
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Appel initializeUpload LinkedIn inattendu — HTTP $HTTP_CODE (voir réponse ci-dessus). Vérifier LINKEDIN_TOKEN ou la disponibilité de l'API LinkedIn."
            exit 1
          fi

          echo "✅ Version API LinkedIn ($API_VERSION) valide."

      - name: Résumé
        if: always()
        run: |
          echo "Facebook (Make.com) : ${{ steps.fb.outcome }}"
          echo "LinkedIn (Make.com) : ${{ steps.li.outcome }}"
          echo "Version API LinkedIn : ${{ steps.li_version.outcome }}"
          if [ "${{ steps.fb.outcome }}" = "failure" ] || [ "${{ steps.li.outcome }}" = "failure" ] || [ "${{ steps.li_version.outcome }}" = "failure" ]; then
            echo "::error::Au moins une vérification a échoué — voir logs ci-dessus. Corriger AVANT le prochain lancement de publication."
            exit 1
          fi
          echo "✅ Scénarios Make.com actifs et version API LinkedIn valide."
