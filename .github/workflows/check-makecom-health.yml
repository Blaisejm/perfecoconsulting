name: PerfEco — Vérification santé pré-publication (Make.com, API LinkedIn, WordPress)

on:
  schedule:
    - cron: '0 20 * * 0,1,3,4'  # Dim/Lun/Mer/Jeu 20h00 UTC = Lun/Mar/Jeu/Ven 07h00 Nouvelle-Calédonie (avant chaque jour de publication)
  workflow_dispatch:
    inputs:
      force_wp_check:
        description: "Forcer la vérification WordPress même si ce n'est pas mardi (test manuel)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier scénario Facebook (Integration Webhooks — 6233263)
        id: fb
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/fb.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6233263")
          echo "HTTP $HTTP_CODE"; cat /tmp/fb.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger le scénario Facebook (6233263) — HTTP $HTTP_CODE"
            exit 1
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/fb.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" != "true" ]; then
            echo "::error::Scénario Facebook (Integration Webhooks, 6233263) INACTIF — https://eu1.make.com/1970457/scenarios/6233263/edit — vérifier la queue puis réactiver."
            exit 1
          fi
          echo "✅ Scénario Facebook actif."

      - name: Vérifier scénario LinkedIn (Integration Webhooks, LinkedIn — 6249513)
        id: li
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/li.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6249513")
          echo "HTTP $HTTP_CODE"; cat /tmp/li.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger le scénario LinkedIn (6249513) — HTTP $HTTP_CODE"
            exit 1
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/li.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" != "true" ]; then
            echo "::error::Scénario LinkedIn (Integration Webhooks, LinkedIn, 6249513) INACTIF — https://eu1.make.com/1970457/scenarios/6249513/edit — vérifier la queue puis réactiver."
            exit 1
          fi
          echo "✅ Scénario LinkedIn actif."

      - name: Vérifier la fraîcheur du contenu à diffuser aujourd'hui/demain
        id: content_freshness
        continue-on-error: true
        run: |
          DOW=$(TZ="Pacific/Noumea" date +%u)  # 1=lundi ... 7=dimanche
          FAIL=0

          check_file() {
            local file="$1" expected_date="$2" label="$3"
            if [ ! -f "$file" ]; then
              echo "::error::[$label] Fichier $file introuvable — rien à diffuser prévu."
              FAIL=1
              return
            fi
            local actual=$(jq -r '.date_prevue' "$file")
            if [ "$actual" != "$expected_date" ]; then
              echo "::error::[$label] $file a date_prevue=$actual, attendu $expected_date — contenu périmé ou pas encore préparé. La diffusion de ce jour échouera si ce n'est pas corrigé avant 11h00 NC."
              FAIL=1
            else
              echo "✅ [$label] $file à jour ($actual)."
            fi
          }

          if [ "$DOW" = "1" ]; then
            TOMORROW=$(TZ="Pacific/Noumea" date -d tomorrow +%Y-%m-%d)
            ENVOYER=$(jq -r '.facebook.envoyer // "false"' automation-queue/mardi.json 2>/dev/null || echo "false")
            if [ "$ENVOYER" = "true" ]; then
              check_file "automation-queue/mardi.json" "$TOMORROW" "Facebook lundi"
            else
              echo "facebook.envoyer=$ENVOYER dans mardi.json — publication lundi déjà gérée autrement ou non prévue, pas de vérification de date nécessaire."
            fi
          elif [ "$DOW" = "2" ]; then
            TODAY=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
            check_file "automation-queue/mardi.json" "$TODAY" "Mardi (carrousel + profil perso + Facebook secours)"
          elif [ "$DOW" = "4" ]; then
            TODAY=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
            check_file "automation-queue/jeudi.json" "$TODAY" "Jeudi (post court)"
          elif [ "$DOW" = "5" ]; then
            TODAY=$(TZ="Pacific/Noumea" date +%Y-%m-%d)
            if [ -f automation-queue/vendredi.json ]; then
              check_file "automation-queue/vendredi.json" "$TODAY" "Vendredi (hors-série ponctuel)"
            else
              echo "Pas de automation-queue/vendredi.json — normal la plupart des semaines (hors-série ponctuel uniquement)."
            fi
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi

      - name: Vérifier que le 3e scénario (PerfEco LinkedIn Publisher, Text Post) est bien désactivé
        id: extra_scenario
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/extra.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6791084")
          echo "HTTP $HTTP_CODE"; cat /tmp/extra.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Impossible d'interroger le 3e scénario (PerfEco LinkedIn Publisher, 6791084) — HTTP $HTTP_CODE (non bloquant)"
            exit 0
          fi
          IS_ACTIVE=$(jq -r '.scenario.isActive' /tmp/extra.json)
          echo "isActive=$IS_ACTIVE"
          if [ "$IS_ACTIVE" = "true" ]; then
            echo "::error::Le 3e scénario (PerfEco LinkedIn Publisher / Company Text Post, 6791084) est ACTIF — le plan Make.com ne tolère que 2 scénarios actifs simultanément, ce qui va probablement désactiver un des 2 scénarios essentiels (Facebook 6233263 ou LinkedIn 6249513). Désactiver ce 3e scénario immédiatement : https://eu1.make.com/1970457/scenarios/6791084/edit — voir NOTE-TECHNIQUE-MAKECOM-05082026.md pour le contexte complet."
            exit 1
          fi
          echo "✅ 3e scénario bien désactivé (pas de risque de dépassement de quota)."

      - name: Vérifier version API LinkedIn (426 NONEXISTENT_VERSION)
        id: li_version
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          MEMBER_URN="urn:li:person:e0QUppRUQ8"
          API_VERSION=$(jq -r '.linkedin_api_version' automation-queue/mardi.json)
          echo "DEBUG: API_VERSION=$API_VERSION (source : automation-queue/mardi.json)"

          if [ -f automation-queue/jeudi.json ]; then
            API_VERSION_JEUDI=$(jq -r '.linkedin_api_version' automation-queue/jeudi.json)
            if [ "$API_VERSION_JEUDI" != "$API_VERSION" ]; then
              echo "::warning::linkedin_api_version diffère entre mardi.json ($API_VERSION) et jeudi.json ($API_VERSION_JEUDI) — à aligner."
            fi
          fi

          jq -n --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}' > /tmp/li_version_body.json
          HTTP_CODE=$(curl -s -o /tmp/li_version.json -w "%{http_code}" -X POST "https://api.linkedin.com/rest/images?action=initializeUpload" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/li_version_body.json)
          echo "HTTP $HTTP_CODE"; cat /tmp/li_version.json

          if [ "$HTTP_CODE" = "426" ] || grep -q "NONEXISTENT_VERSION" /tmp/li_version.json; then
            echo "::error::linkedin_api_version=$API_VERSION expiré (426 NONEXISTENT_VERSION) — mettre à jour automation-queue/mardi.json ET jeudi.json avec une version récente (format AAAAMM, ex. $(date +%Y%m))."
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Appel initializeUpload LinkedIn inattendu — HTTP $HTTP_CODE (voir réponse ci-dessus). Vérifier LINKEDIN_TOKEN ou la disponibilité de l'API LinkedIn."
            exit 1
          fi

          echo "✅ Version API LinkedIn ($API_VERSION) valide."

      - name: Vérifier l'article WordPress avant publication (mardi 11h03)
        id: wp_check
        continue-on-error: true
        env:
          WP_LOGIN: ${{ secrets.WP_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          TODAY_DOW=$(TZ="Pacific/Noumea" date +%u)
          if [ "$TODAY_DOW" != "2" ] && [ "${{ inputs.force_wp_check }}" != "true" ]; then
            echo "Pas mardi (jour NC=$TODAY_DOW) — aucun article WordPress à vérifier aujourd'hui."
            exit 0
          fi

          FILE="automation-queue/mardi.json"
          POST_ID=$(jq -r '.wordpress_post_id // empty' "$FILE")
          if [ -z "$POST_ID" ]; then
            echo "::error::Champ wordpress_post_id absent de $FILE — impossible de vérifier l'article avant la publication de 11h03. L'ajouter lors de la préparation du brief hebdomadaire (perfeco-brief-hebdomadaire, étape 4.9)."
            exit 1
          fi

          AUTH=$(printf '%s:%s' "$WP_LOGIN" "$WP_APP_PASSWORD" | base64 -w0)
          HTTP_CODE=$(curl -s -o /tmp/wp_post.json -w "%{http_code}" -H "Authorization: Basic $AUTH" "https://perfsystemique.fr/wp-json/wp/v2/posts/$POST_ID?context=edit")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible de récupérer l'article WordPress #$POST_ID — HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(jq -r '.status' /tmp/wp_post.json)
          CATEGORIES=$(jq -r '.categories | join(",")' /tmp/wp_post.json)
          TAGS_COUNT=$(jq -r '.tags | length' /tmp/wp_post.json)
          echo "status=$STATUS categories=$CATEGORIES tags_count=$TAGS_COUNT"

          FAIL=0
          if [ "$STATUS" != "future" ] && [ "$STATUS" != "publish" ]; then
            echo "::error::Article WordPress #$POST_ID a le statut '$STATUS' (attendu : future ou publish) — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi
          if [ "$CATEGORIES" = "1" ] || [ -z "$CATEGORIES" ]; then
            echo "::error::Article WordPress #$POST_ID est encore dans la catégorie 'Uncategorized' (ID 1) ou sans catégorie — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi
          if [ "$TAGS_COUNT" = "0" ]; then
            echo "::error::Article WordPress #$POST_ID n'a aucune étiquette — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            FAIL=1
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "✅ Article WordPress #$POST_ID prêt (statut=$STATUS, catégorie(s)=$CATEGORIES, $TAGS_COUNT étiquette(s))."

      - name: Résumé
        if: always()
        run: |
          echo "Facebook (Make.com) : ${{ steps.fb.outcome }}"
          echo "LinkedIn (Make.com) : ${{ steps.li.outcome }}"
          echo "Fraîcheur du contenu à diffuser : ${{ steps.content_freshness.outcome }}"
          echo "3e scénario désactivé : ${{ steps.extra_scenario.outcome }}"
          echo "Version API LinkedIn : ${{ steps.li_version.outcome }}"
          echo "Article WordPress : ${{ steps.wp_check.outcome }}"
          if [ "${{ steps.fb.outcome }}" = "failure" ] || [ "${{ steps.li.outcome }}" = "failure" ] || [ "${{ steps.content_freshness.outcome }}" = "failure" ] || [ "${{ steps.extra_scenario.outcome }}" = "failure" ] || [ "${{ steps.li_version.outcome }}" = "failure" ] || [ "${{ steps.wp_check.outcome }}" = "failure" ]; then
            echo "::error::Au moins une vérification a échoué — voir logs ci-dessus. Corriger AVANT le prochain lancement de publication."
            exit 1
          fi
          echo "✅ Scénarios Make.com actifs (et 3e scénario bien désactivé), version API LinkedIn valide, article WordPress prêt (si mardi)."
