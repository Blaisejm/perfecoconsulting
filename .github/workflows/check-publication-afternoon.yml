name: PerfEco — Vérification après-midi (publication réellement visible)

on:
  schedule:
    - cron: '0 3 * * 1,2,4'  # Lun/Mar/Jeu 03h00 UTC = 14h00 Nouvelle-Calédonie (~3h après les publications 11h00)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le jour NC
        id: day
        run: |
          DOW=$(TZ="Pacific/Noumea" date +%u)
          echo "dow=$DOW" >> "$GITHUB_OUTPUT"
          echo "Jour NC (1=Lundi, 2=Mardi, 4=Jeudi) = $DOW"

      - name: Vérifier le post Facebook du jour (Lundi/Jeudi, si envoyer=true)
        id: fb_check
        if: steps.day.outputs.dow == '1' || steps.day.outputs.dow == '4'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          DOW="${{ steps.day.outputs.dow }}"
          if [ "$DOW" = "1" ]; then
            ENVOYER=$(jq -r '.facebook.envoyer' automation-queue/mardi.json)
          else
            ENVOYER=$(jq -r '.facebook.envoyer' automation-queue/jeudi.json)
          fi
          if [ "$ENVOYER" != "true" ]; then
            echo "facebook.envoyer=$ENVOYER — Facebook non attendu aujourd'hui via ce mécanisme, vérification ignorée."
            exit 0
          fi

          HTTP_CODE=$(curl -s -o /tmp/fb_posts.json -w "%{http_code}" "https://graph.facebook.com/v19.0/552866114572775/posts?fields=created_time,message&limit=5&access_token=$FB_PAGE_TOKEN")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible d'interroger l'API Facebook — HTTP $HTTP_CODE"
            cat /tmp/fb_posts.json
            exit 1
          fi

          MOST_RECENT=$(jq -r '.data[0].created_time // empty' /tmp/fb_posts.json)
          echo "DEBUG: post le plus récent = $MOST_RECENT"
          if [ -z "$MOST_RECENT" ]; then
            echo "::error::Aucun post trouvé sur la page Facebook — vérifier le token ou facebook.com/PerfecoNC."
            exit 1
          fi

          THRESHOLD=$(( $(date -u +%s) - 6*3600 ))
          POST_EPOCH=$(date -d "$MOST_RECENT" +%s)
          if [ "$POST_EPOCH" -lt "$THRESHOLD" ]; then
            echo "::error::Le post Facebook le plus récent date de plus de 6h ($MOST_RECENT) — aucune publication récente détectée. Vérifier manuellement facebook.com/PerfecoNC."
            exit 1
          fi
          echo "✅ Post Facebook récent confirmé ($MOST_RECENT)."

      - name: Vérifier l'article WordPress (Mardi)
        id: wp_check
        if: steps.day.outputs.dow == '2'
        continue-on-error: true
        env:
          WP_LOGIN: ${{ secrets.WP_LOGIN }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          POST_ID=$(jq -r '.wordpress_post_id // empty' automation-queue/mardi.json)
          if [ -z "$POST_ID" ] || [ "$POST_ID" = "0" ]; then
            echo "::error::wordpress_post_id absent/invalide dans automation-queue/mardi.json — impossible de vérifier l'article de cette semaine."
            exit 1
          fi

          AUTH=$(printf '%s:%s' "$WP_LOGIN" "$WP_APP_PASSWORD" | base64 -w0)
          HTTP_CODE=$(curl -s -o /tmp/wp_post.json -w "%{http_code}" -H "Authorization: Basic $AUTH" "https://perfsystemique.fr/wp-json/wp/v2/posts/$POST_ID?context=edit")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Impossible de récupérer l'article WordPress #$POST_ID — HTTP $HTTP_CODE"
            exit 1
          fi

          STATUS=$(jq -r '.status' /tmp/wp_post.json)
          echo "status=$STATUS"
          if [ "$STATUS" != "publish" ]; then
            echo "::error::Article WordPress #$POST_ID toujours au statut '$STATUS' à 14h (pas 'publish') — https://perfsystemique.fr/wp-admin/post.php?post=$POST_ID&action=edit"
            exit 1
          fi

          LINK=$(jq -r '.link' /tmp/wp_post.json)
          PUB_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$LINK")
          if [ "$PUB_CODE" != "200" ]; then
            echo "::error::Article WordPress #$POST_ID marqué 'publish' mais l'URL publique ($LINK) répond HTTP $PUB_CODE."
            exit 1
          fi
          echo "✅ Article WordPress #$POST_ID publié et accessible ($LINK)."

      - name: Vérifier l'article perfeco.nc FR+EN (Mardi)
        id: perfeco_nc_check
        if: steps.day.outputs.dow == '2'
        continue-on-error: true
        run: |
          URL_FR=$(jq -r '.perfeco_nc_url_fr // empty' automation-queue/mardi.json)
          URL_EN=$(jq -r '.perfeco_nc_url_en // empty' automation-queue/mardi.json)
          FAIL=0

          if [ -z "$URL_FR" ]; then
            echo "::error::perfeco_nc_url_fr absent de automation-queue/mardi.json."
            FAIL=1
          else
            CODE_FR=$(curl -s -o /dev/null -w "%{http_code}" "$URL_FR")
            echo "FR ($URL_FR) -> HTTP $CODE_FR"
            if [ "$CODE_FR" != "200" ]; then
              echo "::error::Article perfeco.nc FR inaccessible — $URL_FR — HTTP $CODE_FR"
              FAIL=1
            fi
          fi

          if [ -z "$URL_EN" ]; then
            echo "::error::perfeco_nc_url_en absent de automation-queue/mardi.json."
            FAIL=1
          else
            CODE_EN=$(curl -s -o /dev/null -w "%{http_code}" "$URL_EN")
            echo "EN ($URL_EN) -> HTTP $CODE_EN"
            if [ "$CODE_EN" != "200" ]; then
              echo "::error::Article perfeco.nc EN inaccessible — $URL_EN — HTTP $CODE_EN"
              FAIL=1
            fi
          fi

          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "✅ Articles perfeco.nc FR et EN accessibles."

      - name: Vérifier le post LinkedIn Company Page (Mardi/Jeudi — best-effort, non bloquant)
        id: li_company_check
        if: steps.day.outputs.dow == '2' || steps.day.outputs.dow == '4'
        continue-on-error: true
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          # ⚠️ Vérification best-effort : le schéma exact de l'API de logs Make.com n'a pas encore été confirmé
          # en conditions réelles (pas d'accès direct aux logs privés pour le valider hors ligne). Ce step
          # affiche la réponse brute pour permettre un affinage après un premier run réel — il n'est PAS
          # inclus dans le gate pass/fail final tant que le format n'est pas confirmé (voir résumé ci-dessous).
          HTTP_CODE=$(curl -s -o /tmp/li_logs.json -w "%{http_code}" -H "Authorization: Token $MAKE_API_TOKEN" "https://eu1.make.com/api/v2/scenarios/6249513/logs?pg[limit]=5")
          echo "HTTP $HTTP_CODE"
          cat /tmp/li_logs.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Impossible d'interroger l'historique d'exécution Make.com (LinkedIn Company, 6249513) — HTTP $HTTP_CODE. Vérifier manuellement linkedin.com/company/perfeco-consulting-nc/posts/."
            exit 0
          fi
          echo "::notice::Réponse brute affichée ci-dessus — à examiner pour confirmer le nom des champs (statut, horodatage) et transformer ce step en vérification bloquante."

      - name: Vérifier le post LinkedIn profil perso (Jeudi)
        id: li_profil_check
        if: steps.day.outputs.dow == '4'
        continue-on-error: true
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          URN=$(jq -r '.published_post_urn // empty' automation-queue/jeudi.json)
          if [ -z "$URN" ]; then
            echo "::error::published_post_urn absent de automation-queue/jeudi.json — soit publish-jeudi.yml a échoué ce matin sur ce canal, soit l'URN n'a pas pu être enregistrée. Vérifier manuellement le profil LinkedIn."
            exit 1
          fi

          API_VERSION=$(jq -r '.linkedin_api_version' automation-queue/jeudi.json)
          ENCODED_URN=$(jq -rn --arg u "$URN" '$u | @uri')
          HTTP_CODE=$(curl -s -o /tmp/li_check.json -w "%{http_code}" \
            -H "Authorization: Bearer $LINKEDIN_TOKEN" \
            -H "LinkedIn-Version: $API_VERSION" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            "https://api.linkedin.com/rest/posts/$ENCODED_URN")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Le post LinkedIn profil perso ($URN) n'est plus accessible — HTTP $HTTP_CODE. Vérifier manuellement."
            cat /tmp/li_check.json
            exit 1
          fi
          echo "✅ Post LinkedIn profil perso confirmé accessible ($URN)."

      - name: Résumé
        if: always()
        run: |
          echo "Facebook : ${{ steps.fb_check.outcome || 'non applicable aujourd''hui' }}"
          echo "WordPress (perfsystemique.fr) : ${{ steps.wp_check.outcome || 'non applicable aujourd''hui' }}"
          echo "perfeco.nc (FR+EN) : ${{ steps.perfeco_nc_check.outcome || 'non applicable aujourd''hui' }}"
          echo "LinkedIn Company Page (best-effort, non bloquant) : ${{ steps.li_company_check.outcome || 'non applicable aujourd''hui' }}"
          echo "LinkedIn profil perso : ${{ steps.li_profil_check.outcome || 'non applicable aujourd''hui' }}"
          if [ "${{ steps.fb_check.outcome }}" = "failure" ] || [ "${{ steps.wp_check.outcome }}" = "failure" ] || [ "${{ steps.perfeco_nc_check.outcome }}" = "failure" ] || [ "${{ steps.li_profil_check.outcome }}" = "failure" ]; then
            echo "::error::Au moins une publication attendue aujourd'hui n'est PAS confirmée visible — vérifier manuellement et corriger si besoin."
            exit 1
          fi
          echo "✅ Toutes les publications vérifiables aujourd'hui (14h00 NC) sont confirmées visibles publiquement. LinkedIn Company Page reste à confirmer visuellement pour l'instant (vérification best-effort, voir step dédié)."
